<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校区卡片</title>
    <style id="theme-vars">
:root {
  --sg-background: #f5f7f9;
  --sg-foreground: #1a1d21;
  --sg-card: #ffffff;
  --sg-card-foreground: #1a1d21;
  --sg-popover: #ffffff;
  --sg-popover-foreground: #1a1d21;
  --sg-primary: #2db996;
  --sg-primary-foreground: #ffffff;
  --sg-muted: #f1f3f5;
  --sg-muted-foreground: #6b7280;
  --sg-border: #e5e7eb;
  --sg-input: #e5e7eb;
  --sg-ring: #2db996;

  --sg-success: #22c55e;
  --sg-success-bg: #dcfce7;
  --sg-success-text: #15803d;

  --sg-radius-sm: 4px;
  --sg-radius-md: 8px;
  --sg-radius-lg: 16px;
  --sg-radius-xl: 24px;

  --sg-shadow-card: 0 2px 8px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.04);
  --sg-shadow-float: 0 8px 24px -8px rgba(15, 23, 42, 0.14);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--sg-background);
    --color-foreground: var(--sg-foreground);
    --color-card: var(--sg-card);
    --color-card-foreground: var(--sg-card-foreground);
    --color-popover: var(--sg-popover);
    --color-popover-foreground: var(--sg-popover-foreground);
    --color-primary: var(--sg-primary);
    --color-primary-foreground: var(--sg-primary-foreground);
    --color-muted: var(--sg-muted);
    --color-muted-foreground: var(--sg-muted-foreground);
    --color-border: var(--sg-border);
    --color-input: var(--sg-input);
    --color-ring: var(--sg-ring);
    --radius-sm: var(--sg-radius-sm);
    --radius-md: var(--sg-radius-md);
    --radius-lg: var(--sg-radius-lg);
    --radius-xl: var(--sg-radius-xl);
  }
  @layer base {
    body { background: var(--sg-background); color: var(--sg-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--sg-background); }
      .text-background { color: var(--sg-background); }
      .border-background { border-color: var(--sg-background); }
      .ring-background { --tw-ring-color: var(--sg-background); }
      .bg-foreground { background-color: var(--sg-foreground); }
      .text-foreground { color: var(--sg-foreground); }
      .border-foreground { border-color: var(--sg-foreground); }
      .ring-foreground { --tw-ring-color: var(--sg-foreground); }
      .bg-card { background-color: var(--sg-card); }
      .text-card { color: var(--sg-card); }
      .border-card { border-color: var(--sg-card); }
      .ring-card { --tw-ring-color: var(--sg-card); }
      .bg-card-foreground { background-color: var(--sg-card-foreground); }
      .text-card-foreground { color: var(--sg-card-foreground); }
      .border-card-foreground { border-color: var(--sg-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--sg-card-foreground); }
      .bg-popover { background-color: var(--sg-popover); }
      .text-popover { color: var(--sg-popover); }
      .border-popover { border-color: var(--sg-popover); }
      .ring-popover { --tw-ring-color: var(--sg-popover); }
      .bg-popover-foreground { background-color: var(--sg-popover-foreground); }
      .text-popover-foreground { color: var(--sg-popover-foreground); }
      .border-popover-foreground { border-color: var(--sg-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--sg-popover-foreground); }
      .bg-primary { background-color: var(--sg-primary); }
      .text-primary { color: var(--sg-primary); }
      .border-primary { border-color: var(--sg-primary); }
      .ring-primary { --tw-ring-color: var(--sg-primary); }
      .bg-primary-foreground { background-color: var(--sg-primary-foreground); }
      .text-primary-foreground { color: var(--sg-primary-foreground); }
      .border-primary-foreground { border-color: var(--sg-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--sg-primary-foreground); }
      .bg-muted { background-color: var(--sg-muted); }
      .text-muted { color: var(--sg-muted); }
      .border-muted { border-color: var(--sg-muted); }
      .ring-muted { --tw-ring-color: var(--sg-muted); }
      .bg-muted-foreground { background-color: var(--sg-muted-foreground); }
      .text-muted-foreground { color: var(--sg-muted-foreground); }
      .border-muted-foreground { border-color: var(--sg-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--sg-muted-foreground); }
      .bg-border { background-color: var(--sg-border); }
      .text-border { color: var(--sg-border); }
      .border-border { border-color: var(--sg-border); }
      .ring-border { --tw-ring-color: var(--sg-border); }
      .bg-input { background-color: var(--sg-input); }
      .text-input { color: var(--sg-input); }
      .border-input { border-color: var(--sg-input); }
      .ring-input { --tw-ring-color: var(--sg-input); }
      .bg-ring { background-color: var(--sg-ring); }
      .text-ring { color: var(--sg-ring); }
      .border-ring { border-color: var(--sg-ring); }
      .ring-ring { --tw-ring-color: var(--sg-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased bg-background">
    <!-- 顶部 Banner -->
    <header class="relative w-full h-[220px] overflow-hidden">
      <img src="../assets/banner-studio.jpg" alt="校区环境" class="w-full h-full object-cover" />
      <div class="absolute inset-0 bg-gradient-to-b from-black/10 to-transparent"></div>
      <!-- 模拟小程序导航栏 -->
      <div class="absolute top-0 left-0 right-0 flex items-center justify-between px-4 pt-10 pb-3 text-white">
        <span class="text-sm font-medium opacity-90">WeChat</span>
        <span class="text-sm font-semibold">1:07</span>
        <span class="text-sm font-medium opacity-90">100%</span>
      </div>
    </header>

    <main class="relative -mt-5 px-3 pb-24">
      <!-- 校区卡片：宽而窄，紧贴 banner -->
      <article class="campus-card bg-card rounded-2xl p-3 shadow-[0_2px_12px_rgba(15,23,42,0.06)]">
        <!-- 上排：身份 + 切换 -->
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2.5 min-w-0">
            <!-- 校区 Logo -->
            <div class="flex-shrink-0 w-9 h-9 rounded-lg bg-primary text-primary-foreground flex items-center justify-center text-xs font-bold">
              松
            </div>

            <div class="min-w-0">
              <div class="flex items-center gap-1.5">
                <h2 class="text-[15px] font-semibold text-foreground truncate">中心校区</h2>
                <span class="campus-status inline-flex items-center gap-1 text-[10px] text-muted-foreground">
                  <span class="w-1 h-1 rounded-full bg-muted-foreground"></span>
                  休息中
                </span>
              </div>
              <p class="text-[10px] text-muted-foreground truncate mt-0.5">营业时间 08:00-22:00</p>
            </div>
          </div>

          <!-- 切换门店 -->
          <button type="button" class="campus-switcher flex-shrink-0 inline-flex items-center gap-0.5 px-2 py-1 rounded-full bg-primary/10 text-[11px] font-medium text-primary active:opacity-70 ml-2">
            切换门店
            <i data-lucide="chevron-down" class="w-3 h-3"></i>
          </button>
        </div>

        <!-- 下排：快捷操作 -->
        <div class="campus-actions flex items-center gap-1 mt-2 pt-2 border-t border-border">
          <button type="button" class="inline-flex items-center gap-1 px-2 py-1 rounded-md text-[11px] font-medium text-primary bg-primary/5 active:opacity-70">
            <i data-lucide="map-pin" class="w-3 h-3"></i>
            导航到店
          </button>
          <button type="button" class="inline-flex items-center gap-1 px-2 py-1 rounded-md text-[11px] font-medium text-primary bg-primary/5 active:opacity-70">
            <i data-lucide="phone" class="w-3 h-3"></i>
            联系门店
          </button>
        </div>
      </article>

      <!-- 功能金刚区 -->
      <section class="mt-4 grid grid-cols-2 gap-3">
        <div class="bg-card rounded-xl p-4 border border-border/50">
          <div class="flex items-center gap-2 mb-2">
            <h3 class="text-base font-semibold text-foreground">快速消课</h3>
            <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-red-500 text-white">HOT</span>
          </div>
          <p class="text-xs text-muted-foreground mb-3">快速核销学员或班级课时</p>
          <div class="flex items-center gap-2">
            <span class="inline-flex items-center justify-center w-10 h-6 rounded-full border border-border text-xs font-semibold text-foreground">Go</span>
            <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-primary/10 text-primary">
              <i data-lucide="check" class="w-4 h-4"></i>
            </span>
          </div>
        </div>

        <div class="space-y-3">
          <div class="bg-card rounded-xl p-3 border border-border/50 flex items-center justify-between">
            <div>
              <h3 class="text-sm font-semibold text-foreground">预约课程</h3>
              <p class="text-[11px] text-primary mt-0.5">管理 预约制课程</p>
            </div>
            <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-blue-500 text-white">
              <i data-lucide="user-plus" class="w-4 h-4"></i>
            </span>
          </div>
          <div class="bg-card rounded-xl p-3 border border-border/50 flex items-center justify-between">
            <div>
              <h3 class="text-sm font-semibold text-foreground">学员管理</h3>
              <p class="text-[11px] text-purple-500 mt-0.5">查看 全部学员</p>
            </div>
            <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-purple-500 text-white">
              <i data-lucide="users" class="w-4 h-4"></i>
            </span>
          </div>
        </div>
      </section>

      <!-- 快捷入口 -->
      <section class="mt-4 bg-card rounded-xl p-4 border border-border/50">
        <div class="grid grid-cols-4 gap-y-4 gap-x-2">
          <div class="flex flex-col items-center gap-1.5">
            <span class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-orange-100 text-orange-500">
              <i data-lucide="plus-circle" class="w-5 h-5"></i>
            </span>
            <span class="text-[11px] text-muted-foreground">课时充值</span>
          </div>
          <div class="flex flex-col items-center gap-1.5">
            <span class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-amber-100 text-amber-500">
              <i data-lucide="user-plus" class="w-5 h-5"></i>
            </span>
            <span class="text-[11px] text-muted-foreground">添加学员</span>
          </div>
          <div class="flex flex-col items-center gap-1.5">
            <span class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-cyan-100 text-cyan-500">
              <i data-lucide="clipboard-list" class="w-5 h-5"></i>
            </span>
            <span class="text-[11px] text-muted-foreground">考勤记录</span>
          </div>
          <div class="flex flex-col items-center gap-1.5">
            <span class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-pink-100 text-pink-500">
              <i data-lucide="clock" class="w-5 h-5"></i>
            </span>
            <span class="text-[11px] text-muted-foreground">试听记录</span>
          </div>
          <div class="flex flex-col items-center gap-1.5">
            <span class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-rose-100 text-rose-500">
              <i data-lucide="package" class="w-5 h-5"></i>
            </span>
            <span class="text-[11px] text-muted-foreground">课时套餐</span>
          </div>
          <div class="flex flex-col items-center gap-1.5">
            <span class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-blue-100 text-blue-500">
              <i data-lucide="graduation-cap" class="w-5 h-5"></i>
            </span>
            <span class="text-[11px] text-muted-foreground">班级管理</span>
          </div>
          <div class="flex flex-col items-center gap-1.5">
            <span class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-indigo-100 text-indigo-500">
              <i data-lucide="users-round" class="w-5 h-5"></i>
            </span>
            <span class="text-[11px] text-muted-foreground">教师管理</span>
          </div>
          <div class="flex flex-col items-center gap-1.5">
            <span class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-emerald-100 text-emerald-500">
              <i data-lucide="map-pin" class="w-5 h-5"></i>
            </span>
            <span class="text-[11px] text-muted-foreground">校区设置</span>
          </div>
        </div>
      </section>

      <!-- 今日课表 -->
      <section class="mt-4 bg-card rounded-xl border border-border/50 overflow-hidden">
        <div class="flex items-center gap-6 px-4 pt-4 pb-2 border-b border-border">
          <h3 class="text-base font-semibold text-foreground">今日课表</h3>
          <span class="text-sm text-muted-foreground">待办事项0</span>
          <span class="text-sm text-muted-foreground">最近消课</span>
        </div>
        <div class="flex flex-col items-center justify-center py-10 text-muted-foreground">
          <i data-lucide="calendar-x" class="w-8 h-8 mb-2 opacity-50"></i>
          <span class="text-sm">暂无排课记录</span>
        </div>
      </section>
    </main>

    <!-- 底部 Tab Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-card border-t border-border px-6 py-2 flex items-center justify-between">
      <div class="flex flex-col items-center gap-0.5 text-primary">
        <i data-lucide="home" class="w-6 h-6"></i>
        <span class="text-[10px]">首页</span>
      </div>
      <div class="flex flex-col items-center gap-0.5 text-muted-foreground">
        <i data-lucide="calendar-days" class="w-6 h-6"></i>
        <span class="text-[10px]">课表</span>
      </div>
      <div class="flex flex-col items-center gap-0.5 text-muted-foreground">
        <i data-lucide="check-square" class="w-6 h-6"></i>
        <span class="text-[10px]">考勤</span>
      </div>
      <div class="flex flex-col items-center gap-0.5 text-muted-foreground">
        <i data-lucide="menu-square" class="w-6 h-6"></i>
        <span class="text-[10px]">更多</span>
      </div>
    </nav>

    <script>lucide.createIcons();</script>
</body>
</html>
