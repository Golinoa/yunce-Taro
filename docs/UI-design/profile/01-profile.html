<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的 - 云策教务</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
      padding: 20px;
    }
    .phone-frame {
      width: 375px;
      height: 812px;
      background: #fff;
      border-radius: 44px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.4);
      overflow: hidden;
      position: relative;
      border: 10px solid #1a1a1a;
    }
    .notch {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 150px; height: 30px;
      background: #1a1a1a;
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      z-index: 100;
    }
    .screen {
      width: 100%; height: 100%;
      background: linear-gradient(180deg, #F0F4FF 0%, #F5F8FF 25%, #FFFFFF 55%, #FFFFFF 100%);
      overflow-y: auto;
      position: relative;
    }
    .screen::-webkit-scrollbar { display: none; }

    /* 状态栏 */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 28px 0;
      font-size: 14px;
      font-weight: 600;
      color: #1A1A2E;
    }

    /* 顶部导航 */
    .nav-header {
      padding: 16px 24px;
      text-align: center;
      position: relative;
    }
    .nav-title {
      font-size: 18px;
      font-weight: 600;
      color: #1A1A2E;
    }

    /* 用户信息卡片 */
    .user-card {
      margin: 8px 24px 20px;
      padding: 24px;
      background: linear-gradient(135deg, #5B8CF7 0%, #3B6EF5 100%);
      border-radius: 24px;
      color: #fff;
      box-shadow: 0 12px 36px rgba(59,110,245,0.28);
      position: relative;
      overflow: hidden;
    }
    .user-card::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 180px; height: 180px;
      background: rgba(255,255,255,0.12);
      border-radius: 50%;
    }
    .user-card::after {
      content: '';
      position: absolute;
      bottom: -40px; left: -40px;
      width: 120px; height: 120px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }
    .user-main {
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 1;
    }
    .avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      border: 2px solid rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .user-info { flex: 1; }
    .user-name {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .user-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .meta-tag {
      font-size: 12px;
      padding: 4px 10px;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }

    /* 当前身份卡片 */
    .identity-section {
      margin: 0 24px 20px;
    }
    .section-title {
      font-size: 14px;
      color: #8A92A8;
      margin-bottom: 12px;
      padding-left: 4px;
    }
    .identity-card {
      background: #fff;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 16px rgba(59,110,245,0.06);
      border: 1.5px solid #E8EDF8;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .identity-icon {
      width: 48px; height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .identity-icon.principal { background: #FFF4E0; }
    .identity-icon.teacher { background: #EEF3FF; }
    .identity-icon.parent { background: #F4F0FF; }
    .identity-detail { flex: 1; }
    .identity-role {
      font-size: 16px;
      font-weight: 600;
      color: #1A1A2E;
      margin-bottom: 4px;
    }
    .identity-org {
      font-size: 13px;
      color: #6B7280;
    }
    .identity-status {
      font-size: 12px;
      color: #3B6EF5;
      font-weight: 500;
      padding: 4px 10px;
      background: #EEF3FF;
      border-radius: 12px;
    }

    /* 菜单列表 */
    .menu-group {
      margin: 0 24px 16px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(59,110,245,0.06);
      overflow: hidden;
    }
    .menu-item {
      display: flex;
      align-items: center;
      padding: 16px 18px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .menu-item:active { background: #F8FAFF; }
    .menu-item + .menu-item { border-top: 1px solid #F0F2F7; }
    .menu-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-right: 14px;
      flex-shrink: 0;
    }
    .menu-icon.blue { background: #EEF3FF; }
    .menu-icon.green { background: #E8F8F0; }
    .menu-icon.orange { background: #FFF4E0; }
    .menu-icon.purple { background: #F4F0FF; }
    .menu-icon.red { background: #FFF0F0; }
    .menu-label {
      flex: 1;
      font-size: 15px;
      color: #1A1A2E;
      font-weight: 500;
    }
    .menu-extra {
      font-size: 13px;
      color: #8A92A8;
      margin-right: 6px;
    }
    .menu-arrow {
      font-size: 14px;
      color: #C5CBD8;
    }

    /* 退出登录 */
    .logout-btn {
      margin: 8px 24px 30px;
      padding: 16px;
      background: #fff;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(59,110,245,0.06);
      color: #EF4444;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .logout-btn:active { background: #FFF5F5; }

    .bottom-safe { height: 24px; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="notch"></div>
    <div class="screen">
      <div class="status-bar">
        <span>9:41</span>
        <span>5G</span>
      </div>

      <div class="nav-header">
        <div class="nav-title">我的</div>
      </div>

      <div class="user-card">
        <div class="user-main">
          <div class="avatar">张</div>
          <div class="user-info">
            <div class="user-name">张老师</div>
            <div class="user-meta">
              <span class="meta-tag">教师</span>
              <span class="meta-tag">138****1234</span>
            </div>
          </div>
        </div>
      </div>

      <div class="identity-section">
        <div class="section-title">当前身份</div>
        <div class="identity-card">
          <div class="identity-icon teacher">👨‍🏫</div>
          <div class="identity-detail">
            <div class="identity-role">授课教师</div>
            <div class="identity-org">云策艺术培训 · 主校区</div>
          </div>
          <div class="identity-status">使用中</div>
        </div>
      </div>

      <div class="menu-group">
        <div class="menu-item">
          <div class="menu-icon blue">🔄</div>
          <div class="menu-label">切换身份</div>
          <div class="menu-extra">2 个身份</div>
          <div class="menu-arrow">›</div>
        </div>
        <div class="menu-item">
          <div class="menu-icon green">🎟️</div>
          <div class="menu-label">邀请码管理</div>
          <div class="menu-arrow">›</div>
        </div>
      </div>

      <div class="menu-group">
        <div class="menu-item">
          <div class="menu-icon purple">📄</div>
          <div class="menu-label">用户协议</div>
          <div class="menu-arrow">›</div>
        </div>
        <div class="menu-item">
          <div class="menu-icon purple">🔒</div>
          <div class="menu-label">隐私政策</div>
          <div class="menu-arrow">›</div>
        </div>
        <div class="menu-item">
          <div class="menu-icon orange">💬</div>
          <div class="menu-label">意见反馈</div>
          <div class="menu-arrow">›</div>
        </div>
      </div>

      <div class="menu-group">
        <div class="menu-item">
          <div class="menu-icon red">🚪</div>
          <div class="menu-label">退出登录</div>
          <div class="menu-arrow">›</div>
        </div>
      </div>

      <div class="bottom-safe"></div>
    </div>
  </div>
</body>
</html>
