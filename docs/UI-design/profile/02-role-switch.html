<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>切换身份 - 云策教务</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
      padding: 20px;
    }
    .phone-frame {
      width: 375px;
      height: 812px;
      background: #fff;
      border-radius: 44px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.4);
      overflow: hidden;
      position: relative;
      border: 10px solid #1a1a1a;
    }
    .notch {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 150px; height: 30px;
      background: #1a1a1a;
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      z-index: 100;
    }
    .screen {
      width: 100%; height: 100%;
      background: linear-gradient(180deg, #F0F4FF 0%, #F5F8FF 20%, #FFFFFF 50%, #FFFFFF 100%);
      overflow-y: auto;
      position: relative;
    }
    .screen::-webkit-scrollbar { display: none; }

    /* 状态栏 */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 28px 0;
      font-size: 14px;
      font-weight: 600;
      color: #1A1A2E;
    }

    /* 顶部导航 */
    .nav-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .back-btn {
      position: absolute;
      left: 20px;
      width: 32px; height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #1A1A2E;
      cursor: pointer;
    }
    .nav-title {
      font-size: 18px;
      font-weight: 600;
      color: #1A1A2E;
    }

    /* 标题区 */
    .header-section {
      padding: 12px 24px 20px;
    }
    .header-title {
      font-size: 26px;
      font-weight: 700;
      color: #1A1A2E;
      margin-bottom: 6px;
    }
    .header-subtitle {
      font-size: 14px;
      color: #8A92A8;
    }

    /* 身份列表 */
    .identity-list {
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .identity-card {
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(59,110,245,0.06);
      border: 1.5px solid #E8EDF8;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .identity-card:active { transform: scale(0.99); }
    .identity-card.active {
      border-color: #3B6EF5;
      background: linear-gradient(135deg, #FFFFFF 0%, #F5F8FF 100%);
      box-shadow: 0 8px 24px rgba(59,110,245,0.12);
    }
    .identity-card.active::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: #3B6EF5;
    }
    .identity-icon {
      width: 52px; height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
    }
    .identity-icon.principal { background: #FFF4E0; }
    .identity-icon.teacher { background: #EEF3FF; }
    .identity-icon.parent { background: #F4F0FF; }
    .identity-detail { flex: 1; }
    .identity-role {
      font-size: 17px;
      font-weight: 600;
      color: #1A1A2E;
      margin-bottom: 5px;
    }
    .identity-org {
      font-size: 13px;
      color: #6B7280;
      margin-bottom: 2px;
    }
    .identity-campus {
      font-size: 12px;
      color: #8A92A8;
    }
    .identity-badge {
      font-size: 12px;
      color: #3B6EF5;
      font-weight: 600;
      padding: 5px 12px;
      background: #EEF3FF;
      border-radius: 14px;
      flex-shrink: 0;
    }
    .identity-check {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: #3B6EF5;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    /* 添加新身份 */
    .add-identity {
      margin: 20px 24px 16px;
      padding: 18px 20px;
      border-radius: 20px;
      border: 2px dashed #C5D3F7;
      background: rgba(238, 243, 255, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .add-identity:active { background: #EEF3FF; }
    .add-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #3B6EF5;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 300;
    }
    .add-text {
      font-size: 15px;
      font-weight: 600;
      color: #3B6EF5;
    }

    /* 提示 */
    .hint {
      margin: 0 24px 24px;
      padding: 14px 16px;
      background: #F8FAFF;
      border-radius: 14px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .hint-icon {
      font-size: 16px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .hint-text {
      font-size: 13px;
      color: #6B7280;
      line-height: 1.6;
    }

    /* 底部按钮 */
    .bottom-actions {
      padding: 0 24px 30px;
    }
    .confirm-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #5B8CF7 0%, #3B6EF5 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(59,110,245,0.28);
      cursor: pointer;
    }
    .confirm-btn:active { opacity: 0.9; }

    .bottom-safe { height: 24px; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="notch"></div>
    <div class="screen">
      <div class="status-bar">
        <span>9:41</span>
        <span>5G</span>
      </div>

      <div class="nav-header">
        <div class="back-btn">‹</div>
        <div class="nav-title">切换身份</div>
      </div>

      <div class="header-section">
        <div class="header-title">选择要使用的身份</div>
        <div class="header-subtitle">同一账号可在不同机构拥有不同身份</div>
      </div>

      <div class="identity-list">
        <div class="identity-card active">
          <div class="identity-icon principal">🏫</div>
          <div class="identity-detail">
            <div class="identity-role">机构负责人</div>
            <div class="identity-org">云策艺术培训</div>
            <div class="identity-campus">全部校区</div>
          </div>
          <div class="identity-badge">当前使用</div>
        </div>

        <div class="identity-card">
          <div class="identity-icon teacher">👨‍🏫</div>
          <div class="identity-detail">
            <div class="identity-role">授课教师</div>
            <div class="identity-org">明日教育</div>
            <div class="identity-campus">主校区</div>
          </div>
          <div class="identity-check">✓</div>
        </div>

        <div class="identity-card">
          <div class="identity-icon parent">👨‍👧</div>
          <div class="identity-detail">
            <div class="identity-role">学生家长</div>
            <div class="identity-org">云策艺术培训</div>
            <div class="identity-campus">张小明 · 主校区</div>
          </div>
          <div class="identity-check">✓</div>
        </div>
      </div>

      <div class="add-identity">
        <div class="add-icon">+</div>
        <div class="add-text">添加新身份</div>
      </div>

      <div class="hint">
        <span class="hint-icon">💡</span>
        <div class="hint-text">
          添加新身份需要绑定对应机构或学生。例如：教师在新的校区任教，需要输入该校区的邀请码。
        </div>
      </div>

      <div class="bottom-actions">
        <div class="confirm-btn">进入该身份</div>
      </div>

      <div class="bottom-safe"></div>
    </div>
  </div>
</body>
</html>
