<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教培数据看板 - 深色质感版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
    background: #f0f0f0;
    padding: 40px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  
  .phone-frame {
    width: 375px;
    background: #E8E8E8;
    border-radius: 40px;
    padding: 50px 16px 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 0 12px #333;
    position: relative;
  }
  .phone-frame::before {
    content: '';
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 20px;
    background: #333;
    border-radius: 10px;
  }
  
  .dashboard-title {
    font-size: 20px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 6px;
    text-align: center;
  }
  .dashboard-subtitle {
    font-size: 12px;
    color: #888;
    margin-bottom: 24px;
    text-align: center;
  }
  
  /* ========== 布局：左大 + 右2x2 ========== */
  .dashboard {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr;
    grid-template-rows: 120px 120px;
    gap: 10px;
  }
  
  .card {
    border-radius: 16px;
    padding: 14px 12px;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
    cursor: pointer;
    border: 1px solid rgba(0,0,0,0.04);
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }
  
  .label { 
    color: #1a1a1a; 
    font-size: 14px; 
    font-weight: 700; 
    line-height: 1.3;
    display: block;
  }
  .desc { 
    color: #666; 
    font-size: 11px; 
    margin-top: 2px;
    display: block;
  }
  .value { 
    color: #1a1a1a; 
    font-weight: 800;
    display: block;
  }
  .value .unit { 
    font-weight: 500; 
    color: #555;
    font-size: 12px;
    margin-left: 2px;
  }
  .sub { 
    color: #777; 
    font-size: 11px;
    display: block;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 700;
    margin-top: 4px;
  }
  
  /* ========== 卡片1: 在册学员 - 采集工具蓝 ========== */
  .card-1 {
    grid-row: 1 / 3;
    background: linear-gradient(160deg, #C5D8F5 0%, #D8E5F8 40%, #E8F0FC 100%);
  }
  .card-1 .badge {
    background: rgba(59, 110, 245, 0.15);
    color: #3B6EF5;
  }
  .card-1 .value { 
    font-size: 36px; 
    margin-top: 16px;
    line-height: 1;
  }
  .card-1 .bottom {
    position: absolute;
    bottom: 14px;
    left: 12px;
    color: #666;
    font-size: 12px;
    font-weight: 500;
  }
  /* 人物图标 */
  .card-1 .icon-art {
    position: absolute;
    bottom: 40px;
    right: 10px;
    width: 85px;
    height: 75px;
  }
  .card-1 .person-bg {
    position: absolute;
    bottom: 8px;
    left: 10px;
    width: 55px;
    height: 55px;
    background: linear-gradient(135deg, #90B0F0 0%, #7A9EEC 100%);
    border-radius: 50%;
    opacity: 0.5;
  }
  .card-1 .person-head {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 20px;
    background: rgba(255,255,255,0.7);
    border-radius: 50%;
  }
  .card-1 .person-body {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 32px;
    height: 16px;
    background: rgba(255,255,255,0.6);
    border-radius: 16px 16px 0 0;
  }
  .card-1 .person-sm {
    position: absolute;
    bottom: 20px;
    right: 4px;
    width: 38px;
    height: 38px;
    background: linear-gradient(135deg, #3B6EF5 0%, #2563EB 100%);
    border-radius: 50%;
    opacity: 0.7;
    box-shadow: 0 2px 8px rgba(59, 110, 245, 0.3);
  }
  .card-1 .person-head-sm {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 12px;
    background: rgba(255,255,255,0.8);
    border-radius: 50%;
  }
  .card-1 .person-body-sm {
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 10px;
    background: rgba(255,255,255,0.65);
    border-radius: 10px 10px 0 0;
  }
  
  /* ========== 卡片2: 消耗课时 - 素材紫 ========== */
  .card-2 {
    background: linear-gradient(160deg, #D8D5F0 0%, #E5E2F7 50%, #F0EEFB 100%);
  }
  .card-2 .value { 
    font-size: 26px; 
    margin-top: 6px;
    line-height: 1;
  }
  .card-2 .sub-info {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 10px;
    color: #666;
    font-size: 11px;
    font-weight: 500;
  }
  .card-2 .dot {
    width: 14px; height: 14px;
    border: 2px solid #888;
    border-radius: 50%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-2 .dot-inner {
    width: 6px; height: 6px;
    background: #888;
    border-radius: 50%;
  }
  .card-2 .trend {
    display: flex;
    align-items: center;
    gap: 2px;
    margin-top: 4px;
    color: #666;
    font-size: 11px;
    font-weight: 500;
  }
  /* 时钟图标 */
  .card-2 .icon-art {
    position: absolute;
    bottom: 10px;
    right: 10px;
    width: 45px;
    height: 45px;
  }
  .card-2 .clock-bg {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, #B0B0D8 0%, #9B94C8 100%);
    border-radius: 50%;
    opacity: 0.5;
  }
  .card-2 .clock-hand-v {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -60%);
    width: 3px;
    height: 12px;
    background: rgba(255,255,255,0.8);
    border-radius: 2px;
  }
  .card-2 .clock-hand-h {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-20%, -50%);
    width: 10px;
    height: 3px;
    background: rgba(255,255,255,0.8);
    border-radius: 2px;
  }
  .card-2 .clock-dot {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 16px;
    height: 16px;
    background: linear-gradient(135deg, #3B6EF5 0%, #2563EB 100%);
    border-radius: 50%;
    opacity: 0.6;
    box-shadow: 0 1px 4px rgba(59, 110, 245, 0.3);
  }
  
  /* ========== 卡片3: 上课人次 - 设计大赛橙 ========== */
  .card-3 {
    background: linear-gradient(160deg, #F0E0C0 0%, #F5ECD5 50%, #FDF6E8 100%);
  }
  .card-3 .badge {
    background: rgba(232, 80, 48, 0.12);
    color: #D32F2F;
  }
  .card-3 .value { 
    font-size: 22px; 
    margin-top: 6px;
    line-height: 1;
  }
  .card-3 .trend {
    display: flex;
    align-items: center;
    gap: 2px;
    margin-top: 4px;
    color: #666;
    font-size: 10px;
    font-weight: 500;
  }
  /* 日历图标 */
  .card-3 .icon-art {
    position: absolute;
    bottom: 10px;
    right: 10px;
    width: 40px;
    height: 40px;
  }
  .card-3 .calendar {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 32px;
    height: 28px;
    background: linear-gradient(135deg, #E8A030 0%, #D49020 100%);
    border-radius: 6px;
    opacity: 0.55;
    box-shadow: 0 1px 4px rgba(232, 160, 48, 0.2);
  }
  .card-3 .calendar-ring-left {
    position: absolute;
    top: -5px;
    left: 6px;
    width: 5px;
    height: 10px;
    background: rgba(255,255,255,0.8);
    border-radius: 3px;
  }
  .card-3 .calendar-ring-right {
    position: absolute;
    top: -5px;
    right: 6px;
    width: 5px;
    height: 10px;
    background: rgba(255,255,255,0.8);
    border-radius: 3px;
  }
  .card-3 .calendar-mark {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 3px;
    background: rgba(255,255,255,0.7);
    border-radius: 2px;
  }
  
  /* ========== 卡片4: 新签学员 - Pro红 ========== */
  .card-4 {
    background: linear-gradient(160deg, #F0D0D0 0%, #F5E0E0 50%, #FDF0F0 100%);
  }
  .card-4 .value { 
    font-size: 22px; 
    margin-top: 6px;
    line-height: 1;
  }
  .card-4 .sub {
    margin-top: 4px;
    font-size: 11px;
    font-weight: 500;
  }
  /* 合同图标 */
  .card-4 .icon-art {
    position: absolute;
    bottom: 10px;
    right: 10px;
    width: 45px;
    height: 45px;
  }
  .card-4 .contract-bg {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 34px;
    height: 28px;
    background: linear-gradient(135deg, #E8A0A0 0%, #D88080 100%);
    border-radius: 5px;
    opacity: 0.5;
    box-shadow: 0 1px 4px rgba(200, 80, 80, 0.15);
  }
  .card-4 .contract-line1 {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 2px;
    background: rgba(255,255,255,0.8);
    border-radius: 1px;
  }
  .card-4 .contract-line2 {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 2px;
    background: rgba(255,255,255,0.6);
    border-radius: 1px;
  }
  .card-4 .check-mark {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 16px;
    height: 16px;
    background: linear-gradient(135deg, #E06060 0%, #D04040 100%);
    border-radius: 50%;
    opacity: 0.7;
  }
  .card-4 .check-line1 {
    position: absolute;
    top: 5px;
    left: 4px;
    width: 4px;
    height: 7px;
    border-right: 2px solid rgba(255,255,255,0.95);
    border-bottom: 2px solid rgba(255,255,255,0.95);
    transform: rotate(45deg);
  }
  
  /* ========== 卡片5: 剩余课时 - APP青 ========== */
  .card-5 {
    background: linear-gradient(160deg, #C0E8E8 0%, #D5F0F0 50%, #E8F8F8 100%);
  }
  .card-5 .value { 
    font-size: 26px; 
    margin-top: 6px;
    line-height: 1;
  }
  .card-5 .sub {
    margin-top: 4px;
    font-size: 11px;
    font-weight: 500;
  }
  /* 沙漏图标 */
  .card-5 .icon-art {
    position: absolute;
    bottom: 10px;
    right: 10px;
    width: 42px;
    height: 48px;
  }
  .card-5 .hourglass {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 30px;
    height: 38px;
    opacity: 0.55;
  }
  .card-5 .hourglass-top {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 28px;
    height: 14px;
    background: linear-gradient(180deg, #70D0D0 0%, #50C0C0 100%);
    border-radius: 3px 3px 14px 14px;
  }
  .card-5 .hourglass-middle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 5px;
    height: 5px;
    background: #50C0C0;
    border-radius: 50%;
  }
  .card-5 .hourglass-bottom {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 28px;
    height: 14px;
    background: linear-gradient(180deg, #50C0C0 0%, #30A0A0 100%);
    border-radius: 14px 14px 3px 3px;
  }
  .card-5 .deco-dot {
    position: absolute;
    top: 0;
    right: 0;
    width: 14px;
    height: 14px;
    background: linear-gradient(135deg, #40B0B0 0%, #308080 100%);
    border-radius: 50%;
    opacity: 0.6;
    box-shadow: 0 1px 4px rgba(64, 176, 176, 0.25);
  }
  
  /* 底部 */
  .footer {
    margin-top: 30px;
    text-align: center;
  }
  .footer h3 {
    color: #888;
    font-size: 13px;
    margin-bottom: 12px;
    font-weight: 500;
  }
  .color-strip {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 16px;
  }
  .color-dot {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  
  @media (max-width: 480px) {
    .phone-frame {
      width: 100%;
      max-width: 375px;
      border-radius: 0;
      box-shadow: none;
      padding: 30px 16px;
    }
    .phone-frame::before { display: none; }
  }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="dashboard-title">📊 教培数据看板</div>
  <div class="dashboard-subtitle">花瓣配色 · 深色质感版</div>

  <div class="dashboard">
    
    <!-- 卡片1: 在册学员 -->
    <div class="card card-1">
      <span class="label">在册学员</span>
      <span class="desc">本月新增 +3</span>
      <span class="badge">↑+3</span>
      <span class="value">48<span class="unit">人</span></span>
      <span class="bottom">在册总人数</span>
      <div class="icon-art">
        <div class="person-bg">
          <div class="person-head"></div>
          <div class="person-body"></div>
        </div>
        <div class="person-sm">
          <div class="person-head-sm"></div>
          <div class="person-body-sm"></div>
        </div>
      </div>
    </div>
    
    <!-- 卡片2: 消耗课时 -->
    <div class="card card-2">
      <span class="label">消耗课时</span>
      <span class="desc">本周期课时消耗</span>
      <span class="value">186</span>
      <div class="sub-info">
        <div class="dot"><div class="dot-inner"></div></div>
        <span>课时</span>
      </div>
      <span class="trend">↑ +8.2%环比</span>
      <div class="icon-art">
        <div class="clock-bg">
          <div class="clock-hand-v"></div>
          <div class="clock-hand-h"></div>
        </div>
        <div class="clock-dot"></div>
      </div>
    </div>
    
    <!-- 卡片3: 上课人次 -->
    <div class="card card-3">
      <span class="label">上课人次</span>
      <span class="desc">本周上课统计</span>
      <span class="badge">New</span>
      <span class="value">42<span class="unit">次</span></span>
      <span class="trend">↑ +5.0%环比</span>
      <div class="icon-art">
        <div class="calendar">
          <div class="calendar-ring-left"></div>
          <div class="calendar-ring-right"></div>
          <div class="calendar-mark"></div>
        </div>
      </div>
    </div>
    
    <!-- 卡片4: 新签学员 -->
    <div class="card card-4">
      <span class="label">新签学员</span>
      <span class="desc">本月新签约</span>
      <span class="value">5<span class="unit">人</span></span>
      <span class="sub">¥4,400 新签金额</span>
      <div class="icon-art">
        <div class="contract-bg">
          <div class="contract-line1"></div>
          <div class="contract-line2"></div>
        </div>
        <div class="check-mark">
          <div class="check-line1"></div>
        </div>
      </div>
    </div>
    
    <!-- 卡片5: 剩余课时 -->
    <div class="card card-5">
      <span class="label">剩余课时</span>
      <span class="desc">机构剩余总课时</span>
      <span class="value">1,248<span class="unit">课时</span></span>
      <span class="sub">可消约6.7个月</span>
      <div class="icon-art">
        <div class="hourglass">
          <div class="hourglass-top"></div>
          <div class="hourglass-middle"></div>
          <div class="hourglass-bottom"></div>
        </div>
        <div class="deco-dot"></div>
      </div>
    </div>
    
  </div>
</div>

<div class="footer">
  <h3>深色质感配色方案</h3>
  <div class="color-strip">
    <div class="color-dot" style="background: linear-gradient(160deg, #C5D8F5, #E8F0FC);" title="采集工具蓝"></div>
    <div class="color-dot" style="background: linear-gradient(160deg, #D8D5F0, #F0EEFB);" title="素材紫"></div>
    <div class="color-dot" style="background: linear-gradient(160deg, #F0E0C0, #FDF6E8);" title="设计大赛橙"></div>
    <div class="color-dot" style="background: linear-gradient(160deg, #F0D0D0, #FDF0F0);" title="Pro红"></div>
    <div class="color-dot" style="background: linear-gradient(160deg, #C0E8E8, #E8F8F8);" title="APP青"></div>
  </div>
</div>

</body>
</html>
