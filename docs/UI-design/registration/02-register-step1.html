<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>注册 Step1 - 云策教务</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #3B6EF5;
      --primary-light: #6B95F5;
      --primary-soft: rgba(59,110,245,0.08);
      --text-primary: #1A1A2E;
      --text-secondary: #6B7280;
      --text-tertiary: #9CA3AF;
      --bg-page: #F8FAFF;
      --bg-card: #FFFFFF;
      --border: #E5E9F2;
      --error: #EF4444;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .phone-frame {
      width: 375px; min-height: 812px;
      background: var(--bg-page);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .header-deco {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 220px;
      background: linear-gradient(180deg, rgba(59,110,245,0.08) 0%, transparent 100%);
      z-index: 0;
      overflow: hidden;
    }
    .header-deco::before {
      content: ''; position: absolute;
      width: 180px; height: 180px; border-radius: 50%;
      background: rgba(59,110,245,0.06);
      top: -50px; right: -50px;
    }
    .content {
      position: relative; z-index: 1;
      flex: 1;
      padding: 56px 28px 24px;
      display: flex;
      flex-direction: column;
    }
    /* 返回 */
    .back-btn {
      display: flex; align-items: center; gap: 4px;
      color: var(--text-secondary); font-size: 15px;
      margin-bottom: 28px; cursor: pointer;
      width: fit-content;
    }
    .back-btn svg { width: 20px; height: 20px; }
    /* 步骤指示器 */
    .stepper {
      display: flex; align-items: center; gap: 0;
      margin-bottom: 32px;
    }
    .step-dot {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
      transition: all 0.3s;
    }
    .step-dot.active {
      background: var(--primary); color: white;
      box-shadow: 0 4px 12px rgba(59,110,245,0.25);
    }
    .step-dot.done {
      background: var(--primary-soft); color: var(--primary);
    }
    .step-dot.pending {
      background: #EDF1FA; color: var(--text-tertiary);
    }
    .step-line {
      flex: 1; height: 2px;
      background: #EDF1FA;
      margin: 0 6px;
    }
    .step-line.done { background: var(--primary-soft); }
    /* 标题 */
    .page-title {
      font-size: 26px; font-weight: 700; color: var(--text-primary);
      margin-bottom: 8px;
    }
    .page-subtitle {
      font-size: 15px; color: var(--text-secondary);
      margin-bottom: 32px;
    }
    /* 表单 */
    .form-group { margin-bottom: 18px; }
    .form-label {
      font-size: 13px; font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
      display: flex; align-items: center; gap: 4px;
    }
    .required { color: var(--error); font-size: 14px; }
    .form-input {
      width: 100%; height: 52px;
      border: 1.5px solid var(--border); border-radius: 14px;
      padding: 0 16px; font-size: 15px;
      color: var(--text-primary); background: white;
      outline: none; transition: all 0.2s;
    }
    .form-input::placeholder { color: var(--text-tertiary); }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-soft);
    }
    /* 协议 */
    .agreement {
      display: flex; align-items: flex-start; gap: 10px;
      margin-top: 20px;
    }
    .checkbox {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-radius: 6px; flex-shrink: 0; margin-top: 1px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
    }
    .checkbox.checked { background: var(--primary); border-color: var(--primary); }
    .checkbox.checked svg { display: block; }
    .checkbox svg { display: none; width: 14px; height: 14px; fill: white; }
    .agreement-text { font-size: 13px; color: var(--text-tertiary); line-height: 1.5; }
    .agreement-text a { color: var(--primary); font-weight: 500; text-decoration: none; }
    /* 底部按钮 */
    .bottom-actions {
      margin-top: auto;
      padding-top: 24px;
      display: flex; gap: 12px;
    }
    .submit-btn {
      flex: 1; height: 52px;
      border: none; border-radius: 14px;
      background: linear-gradient(135deg, #6B95F5, #3B6EF5);
      color: white; font-size: 17px; font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(59,110,245,0.25);
      transition: all 0.2s;
    }
    .submit-btn:active { transform: scale(0.98); opacity: 0.95; }
    .safe-area { height: 20px; }
    /* 标注 */
    .annotation {
      position: fixed; top: 20px; right: 20px;
      background: white; border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 280px; font-size: 13px;
      line-height: 1.6; color: var(--text-secondary);
      z-index: 100;
    }
    .annotation h3 { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
    .annotation .note {
      display: inline-block; padding: 2px 8px;
      border-radius: 4px; font-size: 12px; font-weight: 500; margin: 2px 2px;
    }
    .annotation .note.req { background: var(--primary-soft); color: var(--primary); }
    .annotation .note.opt { background: #EDF1FA; color: var(--text-tertiary); }
  </style>
</head>
<body>
  <div class="annotation">
    <h3>注册 Step1 - 创建账号</h3>
    <div style="margin-bottom: 8px;">
      <span class="note req">用户名</span>
      <span class="note req">密码</span>
      <span class="note opt">邀请码</span>
    </div>
    <div style="font-size: 12px; color: #9CA3AF; margin-top: 8px;">
      此步骤与身份无关，纯粹创建"人"<br/>
      邀请码直接展示<br/>
      下一步必须选择身份
    </div>
  </div>

  <div class="phone-frame">
    <div class="header-deco"></div>
    <div class="content">
      <div class="back-btn" onclick="location.href='01-login.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        返回
      </div>

      <div class="stepper">
        <div class="step-dot active">1</div>
        <div class="step-line"></div>
        <div class="step-dot pending">2</div>
        <div class="step-line"></div>
        <div class="step-dot pending">3</div>
      </div>

      <div class="page-title">创建账号</div>
      <div class="page-subtitle">设置用户名与密码，开启云策之旅</div>

      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 用户名</div>
        <input class="form-input" type="text" placeholder="仅字母、数字、下划线" />
      </div>
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 密码</div>
        <input class="form-input" type="password" placeholder="至少6位密码" />
      </div>
      <div class="form-group">
        <div class="form-label">邀请码</div>
        <input class="form-input" type="text" placeholder="输入拉新邀请码（选填）" />
      </div>

      <div class="agreement">
        <div class="checkbox" onclick="this.classList.toggle('checked')">
          <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
        </div>
        <div class="agreement-text">
          我已阅读并同意<a href="#">《用户协议》</a>和<a href="#">《隐私政策》</a>
        </div>
      </div>

      <div class="bottom-actions">
        <button class="submit-btn" onclick="location.href='03-register-step2.html'">下一步</button>
      </div>
      <div class="safe-area"></div>
    </div>
  </div>

</body>
</html>
