<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>登录 - 云策教务</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --zhihu-blue: #3B6EF5;
      --zhihu-blue-dark: #2E5BD9;
      --wechat: #07C160;
      --wechat-dark: #06AD56;
      --text-primary: #1A1A2E;
      --text-secondary: #6B7280;
      --text-tertiary: #9CA3AF;
      --border: #E5E9F2;
      --bg-top: #F0F4FF;
      --bg-mid: #F5F8FF;
      --bg-bottom: #FFFFFF;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #1A1A2E;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    /* 手机外框 */
    .phone-case {
      width: 375px; height: 812px;
      background: #0D0D12;
      border-radius: 50px;
      padding: 12px;
      box-shadow:
        0 0 0 2px #2A2A35,
        0 40px 100px rgba(0,0,0,0.55);
      position: relative;
    }
    .phone-screen {
      width: 100%; height: 100%;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 35%, var(--bg-bottom) 100%);
      border-radius: 40px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* 刘海 */
    .notch {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 126px; height: 34px;
      background: #0D0D12;
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 18px;
      z-index: 50;
    }

    /* 状态栏 */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 28px 0;
      height: 48px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      position: relative;
      z-index: 40;
    }
    .status-left { width: 56px; text-align: left; }
    .status-right { display: flex; align-items: center; gap: 5px; width: 70px; justify-content: flex-end; }
    .signal { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
    .signal span { width: 3px; background: var(--text-primary); border-radius: 1px; }
    .signal span:nth-child(1) { height: 4px; }
    .signal span:nth-child(2) { height: 7px; }
    .signal span:nth-child(3) { height: 10px; }
    .signal span:nth-child(4) { height: 12px; }
    .battery {
      width: 22px; height: 11px;
      border: 1px solid var(--text-primary);
      border-radius: 3px;
      position: relative;
      display: flex; align-items: center; padding: 1px;
    }
    .battery::after {
      content: ''; position: absolute;
      right: -3px; top: 50%; transform: translateY(-50%);
      width: 2px; height: 5px;
      background: var(--text-primary);
      border-radius: 0 1px 1px 0;
    }
    .battery-fill { width: 70%; height: 100%; background: var(--text-primary); border-radius: 1px; }

    /* 内容 */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
      padding: 28px 32px 32px;
    }

    /* 品牌区 */
    .brand-area {
      margin-bottom: 12px;
    }
    .brand-title {
      font-size: 30px; font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .brand-slogan {
      font-size: 15px; color: var(--text-secondary);
    }

    /* IP 图 */
    .ip-section {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 0 14px;
    }
    .ip-glow {
      position: relative;
      width: 220px; height: 220px;
      display: flex; align-items: center; justify-content: center;
    }
    .ip-glow::before {
      content: '';
      position: absolute;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59,110,245,0.12) 0%, rgba(59,110,245,0.03) 55%, transparent 70%);
      filter: blur(6px);
    }
    .ip-placeholder {
      width: 150px; height: 150px;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.7);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      box-shadow:
        inset 0 0 30px rgba(255,255,255,0.9),
        0 16px 40px -14px rgba(59,110,245,0.18);
    }
    .ip-placeholder svg { width: 80px; height: 80px; fill: var(--zhihu-blue); opacity: 0.5; }
    .ip-label {
      position: absolute;
      bottom: -8px;
      font-size: 10px;
      color: var(--text-tertiary);
      background: rgba(255,255,255,0.8);
      padding: 2px 10px;
      border-radius: 8px;
    }

    /* 操作区 */
    .action-area {
      width: 100%;
      margin-top: 10px;
      padding-bottom: 12px;
    }
    .btn {
      width: 100%; height: 48px;
      border: none; border-radius: 24px;
      font-size: 16px; font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-wechat {
      background: linear-gradient(135deg, var(--wechat), var(--wechat-dark));
      color: white;
      box-shadow: 0 8px 22px rgba(7,193,96,0.25);
      margin-bottom: 14px;
    }
    .btn-wechat:active { transform: scale(0.98); opacity: 0.95; }
    .btn-outline {
      background: white;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .btn-outline:active { background: #FAFBFF; transform: scale(0.98); }
    .btn svg { width: 20px; height: 20px; }

    .login-tip {
      text-align: center;
      font-size: 14px;
      color: var(--text-secondary);
      margin: 12px 0 16px;
      line-height: 1.5;
    }
    .login-tip a {
      color: var(--zhihu-blue);
      font-weight: 600;
      text-decoration: none;
    }

    .agreement {
      display: flex; align-items: flex-start; gap: 8px;
      justify-content: center;
    }
    .checkbox {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-radius: 5px; flex-shrink: 0; margin-top: 1px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
    }
    .checkbox.checked { background: var(--zhihu-blue); border-color: var(--zhihu-blue); }
    .checkbox.checked svg { display: block; }
    .checkbox svg { display: none; width: 12px; height: 12px; fill: white; }
    .agreement-text { font-size: 12px; color: var(--text-tertiary); line-height: 1.5; }
    .agreement-text a { color: var(--text-secondary); font-weight: 500; text-decoration: none; }

    /* Home Indicator */
    .home-indicator {
      position: absolute;
      bottom: 8px; left: 50%;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      background: rgba(0,0,0,0.25);
      border-radius: 3px;
      z-index: 50;
    }

    /* 标注 */
    .annotation {
      position: fixed; top: 20px; right: 20px;
      background: white; border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      max-width: 320px; font-size: 13px;
      line-height: 1.6; color: var(--text-secondary);
      z-index: 100;
    }
    .annotation h3 { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
    .annotation .note {
      display: inline-block; padding: 2px 8px;
      border-radius: 4px; font-size: 12px; font-weight: 500;
      margin: 2px 2px;
    }
    .annotation .note.main { background: rgba(59,110,245,0.1); color: var(--zhihu-blue); }
  </style>
</head>
<body>
  <div class="annotation">
    <h3>登录页 - 设计稿 V8</h3>
    <div style="margin-bottom: 8px;">
      <span class="note main">微信登录</span>
      <span class="note main">账号密码</span>
    </div>
    <div style="font-size: 12px; color: #9CA3AF; margin-top: 8px;">
      账号密码登录 → 01-login-account 登录页<br/>
      微信一键登录 → 直接登录/注册，无账号自动创建
    </div>
  </div>

  <div class="phone-case">
    <div class="phone-screen">
      <div class="notch"></div>
      <div class="status-bar">
        <div class="status-left">11:00</div>
        <div></div>
        <div class="status-right">
          <div class="signal"><span></span><span></span><span></span><span></span></div>
          <span style="font-size:12px;">5G</span>
          <div class="battery"><div class="battery-fill"></div></div>
        </div>
      </div>

      <div class="content">
        <div class="brand-area">
          <div class="brand-title">云策教务</div>
          <div class="brand-slogan">让教务管理更简单</div>
        </div>

        <div class="ip-section">
          <div class="ip-glow">
            <div class="ip-placeholder">
              <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
              <span class="ip-label">IP 占位图</span>
            </div>
          </div>
        </div>

        <div class="action-area">
          <button class="btn btn-wechat" onclick="handleWechatLogin()">
            <svg viewBox="0 0 24 24" fill="white"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.269-.03-.407-.03zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z"/></svg>
            微信一键登录
          </button>

          <a href="01-login-account.html" class="btn btn-outline">
            账号密码登录
          </a>

          <div class="login-tip">还没有账号？<a href="02-register-step1.html">立即注册</a></div>

          <div class="agreement">
            <div class="checkbox checked" onclick="this.classList.toggle('checked')">
              <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
            </div>
            <div class="agreement-text">
              注册即代表同意<a href="#">《用户协议》</a>和<a href="#">《隐私政策》</a>
            </div>
          </div>
        </div>
      </div>

      <div class="home-indicator"></div>
    </div>
  </div>

  <script>
    function handleWechatLogin() {
      alert('微信一键登录：新用户自动注册并进入首页');
    }
  </script>
</body>
</html>
