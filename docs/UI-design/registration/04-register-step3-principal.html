<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>注册 Step3 校长 - 云策教务</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #F59E0B;
      --primary-light: #FBBF24;
      --primary-soft: rgba(245,158,11,0.08);
      --text-primary: #1A1A2E;
      --text-secondary: #6B7280;
      --text-tertiary: #9CA3AF;
      --bg-page: #FFFBF5;
      --border: #F3E8D6;
      --error: #EF4444;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .phone-frame {
      width: 375px; min-height: 812px;
      background: var(--bg-page);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .header-deco {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 220px;
      background: linear-gradient(180deg, rgba(245,158,11,0.08) 0%, transparent 100%);
      z-index: 0;
      overflow: hidden;
    }
    .header-deco::before {
      content: ''; position: absolute;
      width: 180px; height: 180px; border-radius: 50%;
      background: rgba(245,158,11,0.06);
      top: -50px; right: -50px;
    }
    .content {
      position: relative; z-index: 1;
      flex: 1;
      padding: 56px 28px 24px;
      display: flex;
      flex-direction: column;
    }
    .back-btn {
      display: flex; align-items: center; gap: 4px;
      color: var(--text-secondary); font-size: 15px;
      margin-bottom: 28px; cursor: pointer;
      width: fit-content;
    }
    .back-btn svg { width: 20px; height: 20px; }
    .stepper { display: flex; align-items: center; margin-bottom: 32px; }
    .step-dot {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600; transition: all 0.3s;
    }
    .step-dot.done { background: var(--primary-soft); color: var(--primary); }
    .step-dot.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(245,158,11,0.25); }
    .step-line { flex: 1; height: 2px; margin: 0 6px; }
    .step-line.done { background: var(--primary-soft); }
    .page-title { font-size: 26px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
    .page-subtitle { font-size: 15px; color: var(--text-secondary); margin-bottom: 32px; }

    .role-header {
      display: flex; align-items: center;
      padding: 16px 18px;
      background: white;
      border-radius: 16px;
      margin-bottom: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.03);
    }
    .role-icon {
      width: 48px; height: 48px; border-radius: 14px;
      background: linear-gradient(135deg, #FBBF24, #F59E0B);
      display: flex; align-items: center; justify-content: center;
      margin-right: 14px;
    }
    .role-icon svg { width: 24px; height: 24px; fill: white; }
    .role-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
    .role-subtitle { font-size: 13px; color: var(--text-tertiary); margin-top: 2px; }

    .form-card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.03);
      margin-bottom: 16px;
    }
    .form-section-title {
      font-size: 16px; font-weight: 600; color: var(--text-primary);
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 8px;
    }
    .form-section-title .dot { width: 4px; height: 16px; border-radius: 2px; background: var(--primary); }
    .form-group { margin-bottom: 18px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-label {
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      margin-bottom: 8px; display: flex; align-items: center; gap: 4px;
    }
    .required { color: var(--error); font-size: 14px; }
    .optional-tag {
      font-size: 11px; color: var(--text-tertiary);
      background: var(--bg-page); padding: 1px 6px;
      border-radius: 4px; font-weight: 400;
    }
    .form-input {
      width: 100%; height: 52px;
      border: 1.5px solid var(--border); border-radius: 14px;
      padding: 0 16px; font-size: 15px;
      color: var(--text-primary); background: white;
      outline: none; transition: all 0.2s;
    }
    .form-input::placeholder { color: var(--text-tertiary); }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-soft);
    }
    .form-hint {
      font-size: 12px; color: var(--text-tertiary);
      margin-top: 8px; line-height: 1.5;
    }

    .bottom-actions {
      margin-top: auto;
      padding-top: 24px;
      display: flex; gap: 12px;
    }
    .btn {
      flex: 1; height: 52px;
      border-radius: 14px;
      font-size: 16px; font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
    }
    .btn-prev {
      background: white;
      border: 1.5px solid var(--border);
      color: var(--text-secondary);
    }
    .btn-next {
      border: none;
      background: linear-gradient(135deg, #FBBF24, #F59E0B);
      color: white;
      box-shadow: 0 8px 24px rgba(245,158,11,0.25);
    }
    .btn-next:active { transform: scale(0.98); opacity: 0.95; }
    .safe-area { height: 20px; }

    .annotation {
      position: fixed; top: 20px; right: 20px;
      background: white; border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 280px; font-size: 13px;
      line-height: 1.6; color: var(--text-secondary);
      z-index: 100;
    }
    .annotation h3 { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
    .annotation .field-tag {
      display: inline-block; padding: 2px 8px;
      border-radius: 4px; font-size: 12px; font-weight: 500; margin: 2px;
    }
    .annotation .field-tag.req { background: var(--primary-soft); color: var(--primary); }
    .annotation .field-tag.opt { background: #F3E8D6; color: var(--text-tertiary); }
  </style>
</head>
<body>
  <div class="annotation">
    <h3>Step3 - 校长信息</h3>
    <div>
      <span class="field-tag req">机构名称</span>
      <span class="field-tag req">负责人手机号</span>
      <span class="field-tag opt">机构地址</span>
    </div>
    <div style="font-size: 12px; color: #9CA3AF; margin-top: 8px;">
      校长直接注册，无需激活码<br/>
      注册即创建机构
    </div>
  </div>

  <div class="phone-frame">
    <div class="header-deco"></div>
    <div class="content">
      <div class="back-btn" onclick="location.href='03-register-step2.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        上一步
      </div>

      <div class="stepper">
        <div class="step-dot done">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
        </div>
        <div class="step-line done"></div>
        <div class="step-dot done">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
        </div>
        <div class="step-line done"></div>
        <div class="step-dot active">3</div>
      </div>

      <div class="page-title">完善校长信息</div>
      <div class="page-subtitle">创建您的机构，开始管理</div>

      <div class="role-header">
        <div class="role-icon">
          <svg viewBox="0 0 24 24"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/></svg>
        </div>
        <div>
          <div class="role-title">校长</div>
          <div class="role-subtitle">机构负责人</div>
        </div>
      </div>

      <div class="form-card">
        <div class="form-section-title"><span class="dot"></span>机构信息</div>
        <div class="form-group">
          <div class="form-label"><span class="required">*</span> 机构名称</div>
          <input class="form-input" type="text" placeholder="请输入培训机构名称" />
        </div>
        <div class="form-group">
          <div class="form-label">机构地址 <span class="optional-tag">选填</span></div>
          <input class="form-input" type="text" placeholder="请输入机构详细地址" />
          <div class="form-hint">该地址将在活动页面展示给家长，请如实填写</div>
        </div>
        <div class="form-group">
          <div class="form-label"><span class="required">*</span> 负责人手机号</div>
          <input class="form-input" type="tel" placeholder="请输入11位手机号" maxlength="11" />
        </div>
      </div>

      <div class="bottom-actions">
        <a href="03-register-step2.html" class="btn btn-prev">上一步</a>
        <button class="btn btn-next" onclick="alert('校长注册完成，进入校长工作台')">完成注册</button>
      </div>
      <div class="safe-area"></div>
    </div>
  </div>
</body>
</html>
