<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>身份切换 - 云策教务</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #3B6EF5;
      --primary-soft: rgba(59,110,245,0.08);
      --amber: #F59E0B;
      --amber-soft: rgba(245,158,11,0.08);
      --purple: #8B5CF6;
      --purple-soft: rgba(139,92,246,0.08);
      --text-primary: #1A1A2E;
      --text-secondary: #6B7280;
      --text-tertiary: #9CA3AF;
      --bg-page: #F8FAFF;
      --border: #E5E9F2;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .phone-frame {
      width: 375px; min-height: 812px;
      background: var(--bg-page);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .header-deco {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 220px;
      background: linear-gradient(180deg, rgba(59,110,245,0.08) 0%, transparent 100%);
      z-index: 0;
      overflow: hidden;
    }
    .header-deco::before {
      content: ''; position: absolute;
      width: 180px; height: 180px; border-radius: 50%;
      background: rgba(59,110,245,0.06);
      top: -50px; right: -50px;
    }
    .content {
      position: relative; z-index: 1;
      flex: 1;
      padding: 56px 28px 24px;
      display: flex;
      flex-direction: column;
    }
    .back-btn {
      display: flex; align-items: center; gap: 4px;
      color: var(--text-secondary); font-size: 15px;
      margin-bottom: 28px; cursor: pointer;
      width: fit-content;
    }
    .back-btn svg { width: 20px; height: 20px; }
    .page-title { font-size: 26px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
    .page-subtitle { font-size: 15px; color: var(--text-secondary); margin-bottom: 32px; }

    /* 当前用户卡片 */
    .user-card {
      display: flex; align-items: center;
      padding: 18px;
      background: white;
      border-radius: 18px;
      margin-bottom: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.03);
    }
    .user-avatar {
      width: 56px; height: 56px; border-radius: 16px;
      background: linear-gradient(135deg, #6B95F5, #3B6EF5);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 22px; font-weight: 600;
      margin-right: 16px;
    }
    .user-info { flex: 1; }
    .user-name { font-size: 17px; font-weight: 600; color: var(--text-primary); }
    .user-phone { font-size: 13px; color: var(--text-tertiary); margin-top: 4px; }

    /* 身份列表 */
    .section-title {
      font-size: 15px; font-weight: 600; color: var(--text-primary);
      margin-bottom: 14px;
    }
    .role-list { display: flex; flex-direction: column; gap: 12px; }
    .role-card {
      display: flex; align-items: center;
      padding: 16px 18px;
      background: white;
      border-radius: 16px;
      border: 2px solid transparent;
      box-shadow: 0 2px 12px rgba(0,0,0,0.03);
      cursor: pointer;
      transition: all 0.25s;
    }
    .role-card:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.05); }
    .role-card.selected.principal { border-color: var(--amber); background: var(--amber-soft); }
    .role-card.selected.teacher { border-color: var(--primary); background: var(--primary-soft); }
    .role-card.selected.parent { border-color: var(--purple); background: var(--purple-soft); }

    .role-icon-wrap {
      width: 48px; height: 48px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin-right: 14px; flex-shrink: 0;
    }
    .principal .role-icon-wrap { background: linear-gradient(135deg, #FBBF24, #F59E0B); }
    .teacher .role-icon-wrap { background: linear-gradient(135deg, #6B95F5, #3B6EF5); }
    .parent .role-icon-wrap { background: linear-gradient(135deg, #A78BFA, #8B5CF6); }
    .role-icon-wrap svg { width: 24px; height: 24px; fill: white; }

    .role-info { flex: 1; }
    .role-name { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
    .role-desc { font-size: 13px; color: var(--text-tertiary); }

    .check-icon {
      width: 22px; height: 22px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-left: 12px;
    }
    .role-card.selected.principal .check-icon { background: var(--amber); }
    .role-card.selected.teacher .check-icon { background: var(--primary); }
    .role-card.selected.parent .check-icon { background: var(--purple); }
    .check-icon svg { display: none; width: 12px; height: 12px; fill: white; }
    .role-card.selected .check-icon svg { display: block; }
    .role-card:not(.selected) .check-icon { border: 2px solid var(--border); }

    /* 添加身份 */
    .add-role-card {
      display: flex; align-items: center; justify-content: center;
      gap: 6px;
      padding: 18px;
      margin-top: 12px;
      background: white;
      border-radius: 16px;
      border: 1.5px dashed var(--border);
      color: var(--text-secondary);
      font-size: 15px; font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 12px rgba(0,0,0,0.03);
    }
    .add-role-card:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
    .add-role-card svg { width: 18px; height: 18px; }

    /* 底部按钮 */
    .bottom-actions {
      margin-top: auto;
      padding-top: 24px;
    }
    .submit-btn {
      width: 100%; height: 52px;
      border: none; border-radius: 14px;
      background: linear-gradient(135deg, #6B95F5, #3B6EF5);
      color: white; font-size: 17px; font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(59,110,245,0.25);
      transition: all 0.2s;
    }
    .submit-btn:active { transform: scale(0.98); opacity: 0.95; }
    .safe-area { height: 20px; }

    /* 标注 */
    .annotation {
      position: fixed; top: 20px; right: 20px;
      background: white; border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 280px; font-size: 13px;
      line-height: 1.6; color: var(--text-secondary);
      z-index: 100;
    }
    .annotation h3 { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
    .annotation .note {
      display: inline-block; padding: 2px 8px;
      background: var(--primary-soft); color: var(--primary);
      border-radius: 4px; font-size: 12px; font-weight: 500;
      margin: 2px 2px;
    }
  </style>
</head>
<body>
  <div class="annotation">
    <h3>身份切换设计</h3>
    <div style="margin-bottom: 8px;">
      <span class="note">列表式身份选择</span>
      <span class="note">当前身份高亮</span>
      <span class="note">可添加新身份</span>
    </div>
    <div style="font-size: 12px; color: #9CA3AF; margin-top: 8px;">
      与注册身份选择页风格统一<br/>
      点击身份切换，当前身份勾选高亮
    </div>
  </div>

  <div class="phone-frame">
    <div class="header-deco"></div>
    <div class="content">
      <div class="back-btn" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        返回
      </div>

      <div class="page-title">切换身份</div>
      <div class="page-subtitle">选择当前要使用的身份</div>

      <div class="user-card">
        <div class="user-avatar">张</div>
        <div class="user-info">
          <div class="user-name">张三</div>
          <div class="user-phone">138****8888</div>
        </div>
      </div>

      <div class="section-title">已拥有的身份</div>
      <div class="role-list">
        <div class="role-card principal selected" onclick="selectRole(this)">
          <div class="role-icon-wrap">
            <svg viewBox="0 0 24 24"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/></svg>
          </div>
          <div class="role-info">
            <div class="role-name">校长</div>
            <div class="role-desc">阳光艺术中心 · 3个校区</div>
          </div>
          <div class="check-icon">
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
          </div>
        </div>

        <div class="role-card teacher" onclick="selectRole(this)">
          <div class="role-icon-wrap">
            <svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg>
          </div>
          <div class="role-info">
            <div class="role-name">教师</div>
            <div class="role-desc">城西校区 · 钢琴课</div>
          </div>
          <div class="check-icon">
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
          </div>
        </div>

        <div class="role-card parent" onclick="selectRole(this)">
          <div class="role-icon-wrap">
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </div>
          <div class="role-info">
            <div class="role-name">家长</div>
            <div class="role-desc">张小萌 · 城西校区</div>
          </div>
          <div class="check-icon">
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
          </div>
        </div>
      </div>

      <div class="add-role-card" onclick="location.href='#'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        添加新身份
      </div>

      <div class="bottom-actions">
        <button class="submit-btn">切换身份</button>
      </div>
      <div class="safe-area"></div>
    </div>
  </div>

  <script>
    function selectRole(el) {
      document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
    }
  </script>
</body>
</html>
