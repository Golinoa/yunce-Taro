<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>注册 Step2 - 云策教务</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #3B6EF5;
      --primary-light: #6B95F5;
      --primary-soft: rgba(59,110,245,0.08);
      --amber: #F59E0B;
      --amber-soft: rgba(245,158,11,0.08);
      --purple: #8B5CF6;
      --purple-soft: rgba(139,92,246,0.08);
      --text-primary: #1A1A2E;
      --text-secondary: #6B7280;
      --text-tertiary: #9CA3AF;
      --bg-page: #F8FAFF;
      --border: #E5E9F2;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .phone-frame {
      width: 375px; min-height: 812px;
      background: var(--bg-page);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .header-deco {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 220px;
      background: linear-gradient(180deg, rgba(59,110,245,0.08) 0%, transparent 100%);
      z-index: 0;
      overflow: hidden;
    }
    .header-deco::before {
      content: ''; position: absolute;
      width: 180px; height: 180px; border-radius: 50%;
      background: rgba(59,110,245,0.06);
      top: -50px; right: -50px;
    }
    .content {
      position: relative; z-index: 1;
      flex: 1;
      padding: 56px 28px 24px;
      display: flex;
      flex-direction: column;
    }
    .back-btn {
      display: flex; align-items: center; gap: 4px;
      color: var(--text-secondary); font-size: 15px;
      margin-bottom: 28px; cursor: pointer;
      width: fit-content;
    }
    .back-btn svg { width: 20px; height: 20px; }
    /* 步骤 */
    .stepper { display: flex; align-items: center; margin-bottom: 32px; }
    .step-dot {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600; transition: all 0.3s;
    }
    .step-dot.done { background: var(--primary-soft); color: var(--primary); }
    .step-dot.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(59,110,245,0.25); }
    .step-dot.pending { background: #EDF1FA; color: var(--text-tertiary); }
    .step-line { flex: 1; height: 2px; margin: 0 6px; }
    .step-line.done { background: var(--primary-soft); }
    .step-line.pending { background: #EDF1FA; }
    .page-title { font-size: 26px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
    .page-subtitle { font-size: 15px; color: var(--text-secondary); margin-bottom: 32px; }

    /* 身份卡片 */
    .role-list { display: flex; flex-direction: column; gap: 14px; }
    .role-card {
      display: flex; align-items: center;
      padding: 18px;
      background: white;
      border-radius: 18px;
      border: 2px solid transparent;
      box-shadow: 0 2px 12px rgba(0,0,0,0.03);
      cursor: pointer;
      transition: all 0.25s;
      position: relative;
    }
    .role-card:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    .role-card.selected.principal { border-color: var(--amber); background: var(--amber-soft); }
    .role-card.selected.teacher { border-color: var(--primary); background: var(--primary-soft); }
    .role-card.selected.parent { border-color: var(--purple); background: var(--purple-soft); }

    /* 图标区 */
    .role-icon-wrap {
      width: 56px; height: 56px;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin-right: 16px;
      flex-shrink: 0;
    }
    .principal .role-icon-wrap { background: linear-gradient(135deg, #FBBF24, #F59E0B); }
    .teacher .role-icon-wrap { background: linear-gradient(135deg, #6B95F5, #3B6EF5); }
    .parent .role-icon-wrap { background: linear-gradient(135deg, #A78BFA, #8B5CF6); }
    .role-icon-wrap svg { width: 28px; height: 28px; fill: white; }

    /* 文字 */
    .role-info { flex: 1; }
    .role-name { font-size: 17px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
    .role-desc { font-size: 13px; color: var(--text-tertiary); line-height: 1.4; }

    /* 单选圆圈 */
    .radio {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-left: 12px;
      transition: all 0.2s;
    }
    .role-card.selected.principal .radio { border-color: var(--amber); background: var(--amber); }
    .role-card.selected.teacher .radio { border-color: var(--primary); background: var(--primary); }
    .role-card.selected.parent .radio { border-color: var(--purple); background: var(--purple); }
    .radio svg { display: none; width: 12px; height: 12px; fill: white; }
    .role-card.selected .radio svg { display: block; }

    /* 底部按钮 */
    .bottom-actions {
      margin-top: auto;
      padding-top: 24px;
      display: flex; gap: 12px;
    }
    .btn {
      flex: 1; height: 52px;
      border-radius: 14px;
      font-size: 16px; font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
    }
    .btn-prev {
      background: white;
      border: 1.5px solid var(--border);
      color: var(--text-secondary);
    }
    .btn-prev:active { background: #F8FAFF; }
    .btn-next {
      border: none;
      background: linear-gradient(135deg, #6B95F5, #3B6EF5);
      color: white;
      box-shadow: 0 8px 24px rgba(59,110,245,0.25);
    }
    .btn-next:active { transform: scale(0.98); opacity: 0.95; }
    .safe-area { height: 20px; }

    .annotation {
      position: fixed; top: 20px; right: 20px;
      background: white; border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 280px; font-size: 13px;
      line-height: 1.6; color: var(--text-secondary);
      z-index: 100;
    }
    .annotation h3 { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
    .annotation .color-dot {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 50%; margin-right: 6px; vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="annotation">
    <h3>注册 Step2 - 选择身份</h3>
    <div style="margin-bottom: 6px;">
      <span class="color-dot" style="background: #F59E0B;"></span>校长
    </div>
    <div style="margin-bottom: 6px;">
      <span class="color-dot" style="background: #3B6EF5;"></span>教师
    </div>
    <div style="margin-bottom: 6px;">
      <span class="color-dot" style="background: #8B5CF6;"></span>家长
    </div>
    <div style="font-size: 12px; color: #9CA3AF; margin-top: 10px;">
      左侧图标 + 标题描述<br/>
      右侧单选圆圈，选中态边框高亮<br/>
      不可跳过，不同身份对应不同页面
    </div>
  </div>

  <div class="phone-frame">
    <div class="header-deco"></div>
    <div class="content">
      <div class="back-btn" onclick="location.href='02-register-step1.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        上一步
      </div>

      <div class="stepper">
        <div class="step-dot done">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
        </div>
        <div class="step-line done"></div>
        <div class="step-dot active">2</div>
        <div class="step-line pending"></div>
        <div class="step-dot pending">3</div>
      </div>

      <div class="page-title">请选择您的身份</div>
      <div class="page-subtitle">不同身份对应不同功能页面，请认真选择</div>

      <div class="role-list">
        <div class="role-card teacher selected" onclick="selectRole(this, 'teacher')">
          <div class="role-icon-wrap">
            <svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg>
          </div>
          <div class="role-info">
            <div class="role-name">我是教师</div>
            <div class="role-desc">在校区授课，管理课程与学员</div>
          </div>
          <div class="radio">
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
          </div>
        </div>

        <div class="role-card principal" onclick="selectRole(this, 'principal')">
          <div class="role-icon-wrap">
            <svg viewBox="0 0 24 24"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/></svg>
          </div>
          <div class="role-info">
            <div class="role-name">我是校长</div>
            <div class="role-desc">创建机构，管理校区与教师团队</div>
          </div>
          <div class="radio">
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
          </div>
        </div>

        <div class="role-card parent" onclick="selectRole(this, 'parent')">
          <div class="role-icon-wrap">
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </div>
          <div class="role-info">
            <div class="role-name">我是家长</div>
            <div class="role-desc">绑定孩子，查看课时与上课记录</div>
          </div>
          <div class="radio">
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
          </div>
        </div>
      </div>

      <div class="bottom-actions">
        <a href="02-register-step1.html" class="btn btn-prev">上一步</a>
        <a href="04-register-step3-teacher.html" class="btn btn-next" id="nextBtn">下一步</a>
      </div>
      <div class="safe-area"></div>
    </div>
  </div>

  <script>
    const roleLinks = {
      principal: '04-register-step3-principal.html',
      teacher: '04-register-step3-teacher.html',
      parent: '04-register-step3-parent.html'
    };
    function selectRole(el, role) {
      document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      document.getElementById('nextBtn').href = roleLinks[role];
    }
  </script>
</body>
</html>
