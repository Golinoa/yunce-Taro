<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>账号密码登录 - 云策教务</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --zhihu-blue: #3B6EF5;
      --zhihu-blue-dark: #2E5BD9;
      --text-primary: #1A1A2E;
      --text-secondary: #6B7280;
      --text-tertiary: #9CA3AF;
      --border: #E5E9F2;
      --bg-top: #F0F4FF;
      --bg-mid: #F5F8FF;
      --bg-bottom: #FFFFFF;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #1A1A2E;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    /* 手机外框 */
    .phone-case {
      width: 375px; height: 812px;
      background: #0D0D12;
      border-radius: 50px;
      padding: 12px;
      box-shadow:
        0 0 0 2px #2A2A35,
        0 40px 100px rgba(0,0,0,0.55);
      position: relative;
    }
    .phone-screen {
      width: 100%; height: 100%;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 35%, var(--bg-bottom) 100%);
      border-radius: 40px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* 刘海 */
    .notch {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 126px; height: 34px;
      background: #0D0D12;
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 18px;
      z-index: 50;
    }

    /* 状态栏 */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 28px 0;
      height: 48px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      position: relative;
      z-index: 40;
    }
    .status-left { width: 56px; text-align: left; }
    .status-right { display: flex; align-items: center; gap: 5px; width: 70px; justify-content: flex-end; }
    .signal { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
    .signal span { width: 3px; background: var(--text-primary); border-radius: 1px; }
    .signal span:nth-child(1) { height: 4px; }
    .signal span:nth-child(2) { height: 7px; }
    .signal span:nth-child(3) { height: 10px; }
    .signal span:nth-child(4) { height: 12px; }
    .battery {
      width: 22px; height: 11px;
      border: 1px solid var(--text-primary);
      border-radius: 3px;
      position: relative;
      display: flex; align-items: center; padding: 1px;
    }
    .battery::after {
      content: ''; position: absolute;
      right: -3px; top: 50%; transform: translateY(-50%);
      width: 2px; height: 5px;
      background: var(--text-primary);
      border-radius: 0 1px 1px 0;
    }
    .battery-fill { width: 70%; height: 100%; background: var(--text-primary); border-radius: 1px; }

    /* 内容 */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
      padding: 28px 32px 32px;
    }

    /* 返回 */
    .nav-back {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
      font-size: 15px;
      margin-bottom: 28px;
      cursor: pointer;
      text-decoration: none;
      width: fit-content;
    }
    .nav-back svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* 标题 */
    .page-title {
      font-size: 28px; font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .page-subtitle {
      font-size: 15px; color: var(--text-secondary);
      margin-bottom: 36px;
    }

    /* 表单 */
    .form-group { margin-bottom: 18px; }
    .form-input {
      width: 100%; height: 52px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 0 18px;
      font-size: 16px; color: var(--text-primary);
      background: rgba(255,255,255,0.8);
      outline: none; transition: all 0.2s;
    }
    .form-input::placeholder { color: var(--text-tertiary); }
    .form-input:focus {
      border-color: var(--zhihu-blue);
      box-shadow: 0 0 0 4px rgba(59,110,245,0.1);
      background: white;
    }
    .forgot-link {
      align-self: flex-end;
      font-size: 13px; color: var(--text-tertiary);
      margin-top: -8px; margin-bottom: 24px;
      cursor: pointer;
      text-decoration: none;
    }
    .forgot-link:hover { color: var(--zhihu-blue); }

    .btn {
      width: 100%; height: 52px;
      border: none; border-radius: 24px;
      font-size: 17px; font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--zhihu-blue), var(--zhihu-blue-dark));
      color: white;
      box-shadow: 0 8px 24px rgba(59,110,245,0.25);
      margin-bottom: 20px;
    }
    .btn-primary:active { transform: scale(0.98); opacity: 0.95; }

    .register-link {
      text-align: center;
      font-size: 14px;
      color: var(--text-secondary);
    }
    .register-link a {
      color: var(--zhihu-blue);
      font-weight: 600;
      text-decoration: none;
    }

    /* Home Indicator */
    .home-indicator {
      position: absolute;
      bottom: 8px; left: 50%;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      background: rgba(0,0,0,0.25);
      border-radius: 3px;
      z-index: 50;
    }

    /* 标注 */
    .annotation {
      position: fixed; top: 20px; right: 20px;
      background: white; border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      max-width: 320px; font-size: 13px;
      line-height: 1.6; color: var(--text-secondary);
      z-index: 100;
    }
    .annotation h3 { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
    .annotation .note {
      display: inline-block; padding: 2px 8px;
      border-radius: 4px; font-size: 12px; font-weight: 500;
      margin: 2px 2px;
    }
    .annotation .note.main { background: rgba(59,110,245,0.1); color: var(--zhihu-blue); }
  </style>
</head>
<body>
  <div class="annotation">
    <h3>账号密码登录页</h3>
    <div style="margin-bottom: 8px;">
      <span class="note main">登录</span>
      <span class="note main">去注册</span>
    </div>
    <div style="font-size: 12px; color: #9CA3AF; margin-top: 8px;">
      已有账号直接登录<br/>
      没有账号跳转 02-register-step1 注册
    </div>
  </div>

  <div class="phone-case">
    <div class="phone-screen">
      <div class="notch"></div>
      <div class="status-bar">
        <div class="status-left">11:00</div>
        <div></div>
        <div class="status-right">
          <div class="signal"><span></span><span></span><span></span><span></span></div>
          <span style="font-size:12px;">5G</span>
          <div class="battery"><div class="battery-fill"></div></div>
        </div>
      </div>

      <div class="content">
        <a href="01-login.html" class="nav-back">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
          返回
        </a>

        <div class="page-title">账号密码登录</div>
        <div class="page-subtitle">欢迎回来，请登录您的账号</div>

        <div class="form-group">
          <input class="form-input" type="text" placeholder="用户名 / 手机号" />
        </div>
        <div class="form-group">
          <input class="form-input" type="password" placeholder="密码" />
        </div>

        <a href="#" class="forgot-link">忘记密码？</a>

        <button class="btn btn-primary" onclick="alert('登录成功，进入首页')">登录</button>
      </div>

      <div class="home-indicator"></div>
    </div>
  </div>
</body>
</html>
