﻿﻿﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>外卖首页 - 设计稿还原</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
      background: #f5f5f5;
      -webkit-font-smoothing: antialiased;
    }
    .app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      background: #fff;
    }

    /* ===== 头部区域渐变背景 ===== */
    .header-area {
      background: linear-gradient(to right top, #FCF745 0%, #F0F948 40%, #E0F850 65%, #C0FC12 85%, #B8F83E 100%);
      position: relative;
      overflow: visible;
      padding-bottom: 50px;
    }
    .header-area::after {
      content: '';
      position: absolute;
      bottom: -80px;
      left: -10%;
      right: -10%;
      height: 130px;
      background:
        radial-gradient(ellipse 45% 50% at 15% 20%, rgba(212,249,53,0.5) 0%, transparent 65%),
        radial-gradient(ellipse 40% 60% at 70% 15%, rgba(229,255,61,0.45) 0%, transparent 60%),
        radial-gradient(ellipse 55% 45% at 40% 40%, rgba(200,245,96,0.35) 0%, transparent 55%),
        radial-gradient(ellipse 35% 50% at 85% 50%, rgba(220,250,80,0.3) 0%, transparent 60%);
      filter: blur(18px);
      pointer-events: none;
      z-index: -1;
    }


    /* ===== 顶部状态栏 ===== */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px 4px;
      height: 44px;
    }
    .status-time {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
      background: rgba(0,0,0,0.06);
      padding: 2px 10px;
      border-radius: 12px;
    }
    .status-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .signal-icon {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
    }
    .signal-bar {
      width: 3px;
      background: #1a1a1a;
      border-radius: 1px;
    }
    .signal-bar:nth-child(1) { height: 5px; }
    .signal-bar:nth-child(2) { height: 8px; }
    .signal-bar:nth-child(3) { height: 11px; }
    .signal-bar:nth-child(4) { height: 14px; }
    .status-5g {
      font-size: 13px;
      font-weight: 700;
      color: #1a1a1a;
    }
    .battery {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .battery-body {
      width: 26px;
      height: 13px;
      border: 1.5px solid #1a1a1a;
      border-radius: 3px;
      position: relative;
      display: flex;
      align-items: center;
      padding: 1.5px;
    }
    .battery-body::after {
      content: '';
      position: absolute;
      right: -3.5px;
      width: 2px;
      height: 6px;
      background: #1a1a1a;
      border-radius: 0 1px 1px 0;
    }
    .battery-level {
      width: 70%;
      height: 100%;
      background: #C8F560;
      border-radius: 1.5px;
    }
    .battery-num {
      font-size: 11px;
      font-weight: 600;
      color: #1a1a1a;
    }

    /* ===== 导航栏 ===== */
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px 0;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-title {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
    }
    .nav-location {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      color: #555;
      font-weight: 400;
      cursor: pointer;
    }
    .loc-pin {
      width: 14px;
      height: 14px;
      border: 1.5px solid #666;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      position: relative;
    }
    .loc-pin::after {
      content: '';
      position: absolute;
      width: 4px;
      height: 4px;
      background: #666;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .loc-arrow {
      font-size: 10px;
      color: #888;
      transition: transform 0.2s;
    }
    .nav-msg {
      position: relative;
      width: 28px;
      height: 28px;
    }
    .nav-msg svg {
      stroke: #1a1a1a;
    }
    .msg-bubble {
      position: absolute;
      top: -6px;
      right: -8px;
      background: #FF4D4F;
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 8px;
      min-width: 18px;
      text-align: center;
      border: 1.5px solid #E5FF3D;
    }

    /* ===== 主标题区域 ===== */
    .hero-section {
      position: relative;
      padding: 12px 20px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }
    .hero-text {
      flex: 1;
    }
    .hero-arrow {
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid #1a1a1a;
      margin-bottom: 4px;
      margin-left: 2.5em;
    }
    .hero-title {
      font-size: 40px;
      font-weight: 900;
      color: #1a1a1a;
      line-height: 1.2;
      letter-spacing: -1px;
    }

    /* ===== 搜索框 + IP 包裹层 ===== */
    .search-ip-wrapper {
      position: relative;
      margin: 12px 16px 0;
    }

    /* ===== 搜索框 ===== */
    .search-box {
      background: white;
      border-radius: 28px;
      display: flex;
      align-items: center;
      padding: 4px 4px 4px 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      height: 52px;
      position: relative;
      z-index: 5;
    }
    .search-icon {
      width: 20px;
      height: 20px;
      border: 2.5px solid #999;
      border-radius: 50%;
      position: relative;
      margin-right: 10px;
      flex-shrink: 0;
    }
    .search-icon::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 2.5px;
      background: #999;
      bottom: -1px;
      right: -4px;
      transform: rotate(45deg);
      border-radius: 1px;
    }
    .search-input {
      flex: 1;
      font-size: 15px;
      color: #bbb;
      border: none;
      outline: none;
      background: transparent;
    }
    .search-btn {
      background: #FFD600;
      color: #1a1a1a;
      font-size: 16px;
      font-weight: 700;
      padding: 0 22px;
      height: 44px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      flex-shrink: 0;
    }

    /* ===== IP 形象 - 绝对定位 趴在搜索框上 ===== */
    /* 
      调节 IP 位置和大小，改下面这 4 个值：
      width:      IP 宽度
      height:     IP 高度  
      right:      距离右边的距离（负值=往右移出容器）
      bottom:     距离搜索框底部的偏移（负值=往下趴，正值=往上缩）
    */
    .ip-container {
      position: absolute;
      right: 12px;
      bottom: 18px;
      width: 180px;
      height: 130px;
      z-index: 100;
      pointer-events: none;
    }
    .ip-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.08));
    }

    /* ===== 金刚区 - 图3风格 ===== */
    .kingkong-section {
      margin: 8px 0 0;
      background: #fff;
      border-radius: 24px 24px 0 0;
      padding: 20px 12px 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      position: relative;
      z-index: 100;
      margin-top: -20px;
      padding-top: 36px;
    }
    .kingkong-section::before {
      content: '';
      position: absolute;
      top: -35px;
      left: 0;
      right: 0;
      height: 55px;
      background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.2) 30%, rgba(255,255,255,0.5) 60%, rgba(255,255,255,0.9) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 12px 12px 0 0;
      pointer-events: none;
    }

    /* 顶部卡片区域 - 倾斜磁片布局 */
    .top-cards {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 0;
      margin-bottom: 20px;
      min-height: 160px;
      position: relative;
      z-index: 1;
    }

    /* 左侧大卡片：只保留左边圆角，右边被裁切 */
    .card-main {
      grid-row: 1 / 3;
      grid-column: 1;
      position: relative;
      border-radius: 20px 0 0 20px;
      overflow: hidden;
      border: none;
    }
    .card-main::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #fff8ee 0%, #ffedda 40%, #ffd6a0 100%);
      clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 100%, 0 100%);
    }
    .card-main-inner {
      position: relative;
      z-index: 1;
      padding: 18px 16px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .card-main-title {
      font-size: 18px;
      font-weight: 800;
      color: #1a1a2e;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .hot-tag {
      background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }
    .card-main-sub {
      font-size: 12px;
      color: #c47a20;
      margin-top: 4px;
    }
    .card-main-btn {
      position: absolute;
      bottom: 16px;
      left: 16px;
      display: inline-block;
      background: #fff;
      color: #e8922f;
      font-size: 14px;
      font-weight: 700;
      padding: 8px 22px;
      border-radius: 20px;
      border: none;
      box-shadow: 0 2px 8px rgba(242,168,47,0.15);
      cursor: pointer;
    }
    .card-main-img {
      position: absolute;
      bottom: 12px;
      right: 22px;
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #f2a82f, #f5bc5c);
      border-radius: 12px;
      opacity: 0.6;
    }
    .card-main-img svg {
      width: 100%;
      height: 100%;
    }

    /* 右侧卡片组 */
    .card-side-group {
      grid-row: 1 / 3;
      grid-column: 2;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-left: -8px;
    }
    /* 右侧小卡片：只保留右边圆角，左边被裁切 */
    .card-side {
      position: relative;
      flex: 1;
      min-height: 0;
      border-radius: 0 12px 12px 0;
      overflow: hidden;
      border: none;
      padding: 0;
    }
    .card-side::after {
      content: '';
      position: absolute;
      inset: 0;
      background: #e8f0fe;
      clip-path: polygon(16px 0, 100% 0, 100% 100%, 8px 100%);
    }
    .card-side:last-child::after {
      background: #fff0eb;
      clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%);
    }
    .card-side-inner {
      position: relative;
      z-index: 1;
      padding: 10px 10px 10px 22px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .card-side-text {
      flex: 1;
    }
    .card-side-title {
      font-size: 13px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 2px;
    }
    .card-side-sub {
      font-size: 11px;
      color: #4285f4;
      font-weight: 600;
    }
    .card-side:last-child .card-side-sub {
      color: #ff7043;
    }
    .card-side-sub .num {
      font-size: 12px;
      font-weight: 700;
    }
    .card-side-sub .text {
      color: #8a9a60;
      font-weight: 400;
    }
    .card-side:last-child .card-side-sub .text {
      color: #bf6040;
    }
    .card-side-icon {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .card-side-icon.blue {
      background: linear-gradient(135deg, #4285f4, #66a9ff);
    }
    .card-side-icon.cyan {
      background: linear-gradient(135deg, #ff7043, #ff8a65);
    }
    .card-side-icon svg {
      width: 14px;
      height: 14px;
      color: #fff;
    }

    /* 底部图标网格 - 横向滑动 */
    .icon-grid {
      display: flex;
      overflow-x: auto;
      gap: 0;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
      position: relative;
      z-index: 1;
    }
    .icon-grid::-webkit-scrollbar {
      display: none;
    }
    .grid-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 25%;
      flex-shrink: 0;
      scroll-snap-align: start;
    }
    .grid-icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .grid-icon-wrap.teal {
      background: linear-gradient(135deg, #9ACD32 0%, #C8E060 100%);
      box-shadow: 0 4px 12px rgba(154,205,50,0.25);
    }
    .grid-icon-wrap.violet {
      background: linear-gradient(135deg, #20B2AA 0%, #48D1CC 100%);
      box-shadow: 0 4px 12px rgba(32,178,170,0.25);
    }
    .grid-icon-wrap.orange {
      background: linear-gradient(135deg, #FFB347 0%, #FFCC80 100%);
      box-shadow: 0 4px 12px rgba(255,179,71,0.25);
    }
    .grid-icon-wrap.rose {
      background: linear-gradient(135deg, #FF7F50 0%, #FFA07A 100%);
      box-shadow: 0 4px 12px rgba(255,127,80,0.25);
    }
    .grid-icon-wrap.sky {
      background: linear-gradient(135deg, #87CEEB 0%, #B0E0E6 100%);
      box-shadow: 0 4px 12px rgba(135,206,235,0.25);
    }
    .grid-icon-wrap.slate {
      background: linear-gradient(135deg, #8B8B7A 0%, #B5B5A5 100%);
      box-shadow: 0 4px 12px rgba(139,139,122,0.25);
    }
    .grid-icon-wrap svg {
      width: 20px;
      height: 20px;
      color: #fff;
    }
    .grid-label {
      font-size: 11px;
      color: #555;
      font-weight: 500;
      white-space: nowrap;
    }

    /* 分页指示器 */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 16px;
      position: relative;
      z-index: 1;
    }
    .dot {
      width: 16px;
      height: 4px;
      border-radius: 2px;
      background: #ddd;
    }
    .dot.active {
      background: #FFD600;
    }

    /* ===== Tab 切换栏 ===== */
    .tab-bar {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 12px 16px 8px;
      background: transparent;
      position: relative;
      z-index: 1;
    }
    .tab-item {
      font-size: 14px;
      font-weight: 500;
      color: #999;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      padding: 4px 10px;
      border-radius: 12px;
      position: relative;
      z-index: 0;
    }
    .tab-item.active {
      color: #1a1a1a;
      font-size: 18px;
      font-weight: 800;
    }
    .tab-item.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 14px;
      background: radial-gradient(ellipse at center, #9ACD32 0%, #C8E060 40%, transparent 75%);
      border-radius: 50%;
      filter: blur(5px);
      opacity: 0.7;
      z-index: -1;
    }
    .tab-badge {
      display: inline-block;
      background: #ff4757;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      padding: 0 4px;
      border-radius: 8px;
      min-width: 14px;
      height: 14px;
      line-height: 14px;
      text-align: center;
      vertical-align: top;
      margin-left: 2px;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 头部区域 -->
    <div class="header-area">
      <!-- 状态栏 -->
    <div class="status-bar">
      <div class="status-time">16:38</div>
      <div class="status-right">
        <div class="signal-icon">
          <div class="signal-bar"></div>
          <div class="signal-bar"></div>
          <div class="signal-bar"></div>
          <div class="signal-bar"></div>
        </div>
        <span class="status-5g">5G</span>
        <div class="battery">
          <div class="battery-body">
            <div class="battery-level"></div>
          </div>
          <span class="battery-num">61</span>
        </div>
      </div>
    </div>

    <!-- 导航栏 -->
    <div class="nav-bar">
      <div class="nav-left">
        <span class="nav-title">盛睿艺术</span>
        <div class="nav-location">
          <div class="loc-pin"></div>
          <span>主校区</span>
          <span class="loc-arrow">▾</span>
        </div>
      </div>
      <div class="nav-msg">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <div class="msg-bubble">99+</div>
      </div>
    </div>

    <!-- 主标题 -->
    <div class="hero-section">
      <div class="hero-text">
        <div class="hero-arrow"></div>
        <div class="hero-title">你好~ 老师</div>
      </div>
    </div>

    <!-- 搜索框 + IP 包裹层 -->
    <div class="search-ip-wrapper">
      <!-- 搜索框 -->
      <div class="search-box">
        <div class="search-icon"></div>
        <input class="search-input" type="text" placeholder="CHAGEE 霸土余姬" readonly>
        <button class="search-btn">搜索</button>
      </div>

  <script>
    // 图标滑动分页
    const grid = document.querySelector('.icon-grid');
    const dots = document.querySelectorAll('.pagination .dot');
    if (grid && dots.length) {
      const itemWidth = grid.offsetWidth / 4;
      const maxScroll = grid.scrollWidth - grid.offsetWidth;
      grid.addEventListener('scroll', () => {
        const progress = grid.scrollLeft / maxScroll;
        const page = Math.round(progress * (dots.length - 1));
        dots.forEach((d, i) => d.classList.toggle('active', i === page));
      });
      dots.forEach((dot, i) => {
        dot.addEventListener('click', () => {
          grid.scrollTo({ left: i * itemWidth * 4, behavior: 'smooth' });
        });
      });
    }

    // Tab 切换
    const tabs = document.querySelectorAll('.tab-item');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
      });
    });
  </script>
