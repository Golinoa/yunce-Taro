<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bento 卡片</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      background: #eef1f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .outer-container {
      width: 350px;
      background: #f5f7fa;
      border-radius: 24px;
      padding: 12px;
    }

    .bento-grid {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 0;
    }

    /* ========== 大卡片：右边被裁切，只保留左边圆角 ========== */
    .card-large {
      grid-row: 1 / 3;
      grid-column: 1;
      position: relative;
      min-height: 120px;
      border-radius: 20px 0 0 20px;  /* 只保留左边圆角 */
      overflow: hidden;
    }

    .card-large::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #eef5ff 0%, #e0ecff 100%);
      clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 100%, 0 100%);
    }

    .card-large-inner {
      position: relative;
      z-index: 1;
      padding: 14px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ========== 右侧列 ========== */
    .right-column {
      grid-row: 1 / 3;
      grid-column: 2;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-left: -8px;
    }

    /* ========== 上小卡片：左边被裁切，只保留右边圆角 ========== */
    .card-top-right {
      position: relative;
      flex: 1;
      min-height: 0;
      border-radius: 0 12px 12px 0;  /* 只保留右边圆角 */
      overflow: hidden;
    }

    .card-top-right::after {
      content: '';
      position: absolute;
      inset: 0;
      background: #fff;
      clip-path: polygon(16px 0, 100% 0, 100% 100%, 8px 100%);
    }

    /* ========== 下小卡片：左边被裁切，只保留右边圆角 ========== */
    .card-bottom-right {
      position: relative;
      flex: 1;
      min-height: 0;
      border-radius: 0 12px 12px 0;  /* 只保留右边圆角 */
      overflow: hidden;
    }

    .card-bottom-right::after {
      content: '';
      position: absolute;
      inset: 0;
      background: #fff;
      clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%);
    }

    .card-right-inner {
      position: relative;
      z-index: 1;
      padding: 10px 10px 10px 22px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* 文字样式 */
    .card-large .title {
      font-size: 15px;
      font-weight: 800;
      color: #1a1a2e;
    }

    .hot-tag {
      display: inline-block;
      background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      margin-left: 3px;
      vertical-align: middle;
    }

    .subtitle {
      font-size: 11px;
      color: #8ba4c7;
      margin-top: 4px;
    }

    .deco-block {
      position: absolute;
      bottom: 12px;
      right: 22px;
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #a8c6ff, #c8d9ff);
      border-radius: 12px;
      opacity: 0.6;
    }

    .btn-action {
      position: absolute;
      bottom: 14px;
      left: 14px;
      padding: 5px 14px;
      background: #fff;
      color: #4a7dff;
      border: none;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(74,125,255,0.12);
      cursor: pointer;
    }

    .card-right .title {
      font-size: 13px;
      font-weight: 700;
      color: #1a1a2e;
    }

    .card-right .count {
      font-size: 11px;
      color: #ff7b8a;
      font-weight: 600;
      margin-top: 2px;
    }

    .card-right .count .num {
      font-size: 12px;
      font-weight: 700;
    }

    .card-right .count .text {
      color: #8ba4c7;
      font-weight: 400;
    }

    .icon-wrap {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      z-index: 2;
    }

    .icon-school {
      background: linear-gradient(135deg, #5b8cff, #7aa5ff);
    }

    .icon-major {
      background: linear-gradient(135deg, #00c9c9, #00d4d4);
    }
  </style>
<base target="_blank">
</head>
<body>
  <div class="outer-container">
    <div class="bento-grid">
      <div class="card-large">
        <div class="card-large-inner">
          <div class="title">志愿精准匹配<span class="hot-tag">HOT</span></div>
          <div class="subtitle">AI 智能推荐最适合你的院校</div>
          <div class="deco-block"></div>
          <button class="btn-action">立即匹配</button>
        </div>
      </div>

      <div class="right-column">
        <div class="card-top-right card-right">
          <div class="card-right-inner">
            <div class="icon-wrap icon-school">🏫</div>
            <div class="title">院校库</div>
            <div class="count"><span class="num">2,847</span> <span class="text">所院校</span></div>
          </div>
        </div>

        <div class="card-bottom-right card-right">
          <div class="card-right-inner">
            <div class="icon-wrap icon-major">📚</div>
            <div class="title">专业库</div>
            <div class="count"><span class="num">1,536</span> <span class="text">个专业</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
