<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>好用消课 - 工作台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f5f5f5;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            background: #f5f5f5;
            overflow-x: hidden;
        }

        /* 背景层 */
        .gradient-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50vh;
            min-height: 340px;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #ffa070 0%, #ff8a55 25%, #ff6b35 50%, #ff5a2e 75%, #ff4a1e 100%);
        }

        /* 白色丝绸飘带 SVG */
        .silk-ribbon-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.35;
        }

        /* 底部融合过渡 */
        .gradient-fade {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 180px;
            background: linear-gradient(to bottom, 
                transparent 0%, 
                rgba(255, 120, 80, 0.03) 15%,
                rgba(255, 150, 110, 0.06) 30%, 
                rgba(255, 180, 150, 0.08) 45%,
                rgba(255, 210, 190, 0.12) 60%,
                rgba(250, 240, 235, 0.3) 75%,
                rgba(248, 245, 243, 0.6) 85%,
                rgba(245, 245, 245, 0.9) 95%,
                #f5f5f5 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* 装饰性圆点图案 */
        .dots-pattern {
            position: absolute;
            top: 80px;
            right: 30px;
            width: 140px;
            height: 140px;
            opacity: 0.1;
            z-index: 3;
        }

        /* 内容层 */
        .content {
            position: relative;
            z-index: 4;
        }

        /* 配色切换按钮 */
        .color-switcher {
            position: fixed;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 200;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 8px;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .color-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .color-btn:hover {
            transform: scale(1.2);
        }

        .color-btn.active {
            border-color: #333;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.8), 0 0 0 4px #333;
        }

        .color-btn[data-scheme="orange"] { background: linear-gradient(135deg, #ffa070, #ff6b35); }
        .color-btn[data-scheme="blue"] { background: linear-gradient(135deg, #7EC8E3, #5B9BD5); }
        .color-btn[data-scheme="green"] { background: linear-gradient(135deg, #7FD8BE, #4DB89A); }
        .color-btn[data-scheme="lime"] { background: linear-gradient(135deg, #C4E17F, #9BC53D); }

        /* 顶部状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 16px 0;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
        }

        .status-bar .right {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
        }

        /* 头部区域 */
        .header {
            padding: 20px 16px 28px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .greeting {
            color: #fff;
        }

        .greeting h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .campus {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-old {
            padding: 4px 12px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            color: #fff;
            font-size: 13px;
            background: transparent;
        }

        .btn-scan {
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            background: transparent;
        }

        /* 统计卡片 */
        .stats-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            margin: 0 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            margin-top: -8px;
        }

        .stats-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 6px 16px;
            border-radius: 16px;
            font-size: 13px;
            color: #666;
            background: #f5f5f5;
            border: none;
            cursor: pointer;
        }

        .tab.active {
            background: #ff7a45;
            color: #fff;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            text-align: center;
        }

        .stat-item .number {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin-bottom: 4px;
        }

        .stat-item .label {
            font-size: 12px;
            color: #999;
        }

        /* 功能网格 */
        .features-card {
            background: #fff;
            border-radius: 16px;
            margin: 20px 16px;
            padding: 20px 16px;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px 8px;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .feature-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.6),
                0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .feature-icon .icon-inner {
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.1));
        }

        .feature-item:nth-child(1) .feature-icon { background: linear-gradient(135deg, rgba(139, 92, 246, 0.15) 0%, rgba(167, 139, 250, 0.2) 100%); }
        .feature-item:nth-child(1) .icon-inner { color: #8b5cf6; }

        .feature-item:nth-child(2) .feature-icon { background: linear-gradient(135deg, rgba(249, 115, 22, 0.15) 0%, rgba(251, 146, 60, 0.2) 100%); }
        .feature-item:nth-child(2) .icon-inner { color: #f97316; }

        .feature-item:nth-child(3) .feature-icon { background: linear-gradient(135deg, rgba(239, 68, 68, 0.15) 0%, rgba(248, 113, 113, 0.2) 100%); }
        .feature-item:nth-child(3) .icon-inner { color: #ef4444; }

        .feature-item:nth-child(4) .feature-icon { background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(96, 165, 250, 0.2) 100%); }
        .feature-item:nth-child(4) .icon-inner { color: #3b82f6; }

        .feature-item:nth-child(5) .feature-icon { background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(96, 165, 250, 0.2) 100%); }
        .feature-item:nth-child(5) .icon-inner { color: #3b82f6; }

        .feature-item:nth-child(6) .feature-icon { background: linear-gradient(135deg, rgba(239, 68, 68, 0.15) 0%, rgba(248, 113, 113, 0.2) 100%); }
        .feature-item:nth-child(6) .icon-inner { color: #ef4444; }

        .feature-item:nth-child(7) .feature-icon { background: linear-gradient(135deg, rgba(139, 92, 246, 0.15) 0%, rgba(167, 139, 250, 0.2) 100%); }
        .feature-item:nth-child(7) .icon-inner { color: #8b5cf6; }

        .feature-item:nth-child(8) .feature-icon { background: linear-gradient(135deg, rgba(168, 85, 247, 0.15) 0%, rgba(192, 132, 252, 0.2) 100%); }
        .feature-item:nth-child(8) .icon-inner { color: #a855f7; }

        .feature-label {
            font-size: 13px;
            color: #333;
        }

        /* 今日课表 */
        .schedule-card {
            background: #fff;
            border-radius: 16px;
            margin: 0 16px 80px;
            padding: 20px 16px;
        }

        .schedule-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
        }

        .schedule-item {
            padding: 16px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .schedule-item:last-child {
            border-bottom: none;
        }

        .schedule-time-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .schedule-time {
            font-size: 18px;
            font-weight: 600;
            color: #ff7a45;
        }

        .schedule-dot {
            color: #999;
            font-size: 14px;
        }

        .schedule-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .schedule-tag {
            display: inline-block;
            padding: 2px 8px;
            background: #fff2e8;
            color: #ff7a45;
            font-size: 11px;
            border-radius: 4px;
            margin-left: 4px;
        }

        .schedule-teacher {
            font-size: 14px;
            color: #999;
            margin-bottom: 12px;
        }

        .schedule-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .schedule-count {
            font-size: 14px;
            color: #666;
        }

        .schedule-count .num {
            font-weight: 600;
            color: #333;
        }

        .btn-rollcall {
            padding: 8px 24px;
            background: linear-gradient(135deg, #ff7a45 0%, #ff5a2e 100%);
            color: #fff;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(255, 90, 46, 0.3);
        }

        /* 底部TabBar */
        .tabbar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 20px;
            z-index: 100;
        }

        .tabbar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #999;
            font-size: 12px;
        }

        .tabbar-item.active {
            color: #ff7a45;
        }

        .tabbar-icon {
            font-size: 24px;
        }
    </style>
<base target="_blank">
</head>

                        <stop offset="60%" style="stop-color:rgba(255,255,255,0.12)"/>
                        <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
                    </linearGradient>
                    <filter id="silkBlur" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="12"/>

                </defs>

                <path d="M -20,20 
                         Q 80,60 150,40 
                         Q 220,20 280,80 
                         Q 340,140 400,100 
                         Q 460,60 450,180 
                         Q 440,280 350,260 
                         Q 260,240 200,280 
                         Q 140,320 60,280 
                         Q -20,240 -20,180 Z"

                <path d="M 200,-20

                         Q 480,120 420,160 
                         Q 360,200 300,160 
                         Q 240,120 200,160 
                         Q 160,200 180,120

                <path d="M -20,150 
                         Q 100,120 200,160 
                         Q 300,200 400,150

    <script>
        const colorSchemes = {
            orange: {
                bg: 'linear-gradient(135deg, #ffa070 0%, #ff8a55 25%, #ff6b35 50%, #ff5a2e 75%, #ff4a1e 100%)',
                primary: '#ff7a45',
                scheduleTime: '#ff7a45',
                scheduleTagBg: '#fff2e8',
                scheduleTagColor: '#ff7a45',
                btnRollcall: 'linear-gradient(135deg, #ff7a45 0%, #ff5a2e 100%)',
                tabActive: '#ff7a45',
                tabbarActive: '#ff7a45'
            },
            blue: {
                bg: 'linear-gradient(135deg, #A8D8EA 0%, #8ECAE6 25%, #7EC8E3 50%, #6BB5D0 75%, #5B9BD5 100%)',
                primary: '#5B9BD5',
                scheduleTime: '#5B9BD5',
                scheduleTagBg: '#E8F4FA',
                scheduleTagColor: '#5B9BD5',
                btnRollcall: 'linear-gradient(135deg, #7EC8E3 0%, #5B9BD5 100%)',
                tabActive: '#5B9BD5',
                tabbarActive: '#5B9BD5'
            },
            green: {
                bg: 'linear-gradient(135deg, #A8E6CF 0%, #8ED8C0 25%, #7FD8BE 50%, #6BC8AE 75%, #4DB89A 100%)',
                primary: '#4DB89A',
                scheduleTime: '#4DB89A',
                scheduleTagBg: '#E8F5F0',
                scheduleTagColor: '#4DB89A',
                btnRollcall: 'linear-gradient(135deg, #7FD8BE 0%, #4DB89A 100%)',
                tabActive: '#4DB89A',
                tabbarActive: '#4DB89A'
            },
            lime: {
                bg: 'linear-gradient(135deg, #D4E8A0 0%, #C4E17F 25%, #B8D96E 50%, #A8CF5A 75%, #9BC53D 100%)',
                primary: '#9BC53D',
                scheduleTime: '#9BC53D',
                scheduleTagBg: '#F0F7E0',
                scheduleTagColor: '#9BC53D',
                btnRollcall: 'linear-gradient(135deg, #C4E17F 0%, #9BC53D 100%)',
                tabActive: '#9BC53D',
                tabbarActive: '#9BC53D'
            }
        };

        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const scheme = this.dataset.scheme;
                const colors = colorSchemes[scheme];

                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                document.querySelector('.gradient-bg').style.background = colors.bg;

                document.querySelectorAll('.schedule-time').forEach(el => {
                    el.style.color = colors.scheduleTime;
                });

                document.querySelectorAll('.schedule-tag').forEach(el => {
                    el.style.background = colors.scheduleTagBg;
                    el.style.color = colors.scheduleTagColor;
                });

                document.querySelectorAll('.btn-rollcall').forEach(el => {
                    el.style.background = colors.btnRollcall;
                });

                document.querySelectorAll('.tab.active').forEach(el => {
                    el.style.background = colors.tabActive;
                });

                document.querySelectorAll('.tabbar-item.active').forEach(el => {
                    el.style.color = colors.tabbarActive;
                });
            });
        });
    </script>
</body>
</html>
