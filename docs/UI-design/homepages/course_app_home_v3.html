<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>好用消课 - 首页</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Noto Sans SC', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background: #f5f5f5;
            overflow-x: hidden;
        }

        /* 顶部橙色背景 */
        .header-bg {
            background: linear-gradient(135deg, #ff7a45 0%, #ff9966 50%, #ff7a45 100%);
            position: relative;
            overflow: hidden;
        }
        .header-bg::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }
        .header-bg::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 200px;
            height: 200px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
        }

        /* 状态栏模拟 */
        .status-bar {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        /* 胶囊按钮 */
        .capsule-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            padding: 4px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 统计卡片 */
        .stats-card {
            background: white;
            border-radius: 16px;
            margin: 0 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        /* Tab */
        .tab-active {
            background: linear-gradient(135deg, #ff7a45, #ff9966);
            color: white;
            border-radius: 20px;
            padding: 6px 18px;
            font-size: 13px;
            font-weight: 500;
        }
        .tab-inactive {
            color: #999;
            padding: 6px 18px;
            font-size: 13px;
        }

        /* 功能网格 */
        .feature-grid {
            background: white;
            border-radius: 16px;
            margin: 12px 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .feature-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 8px;
        }

        /* 课程卡片 */
        .course-card {
            background: white;
            border-radius: 12px;
            margin: 0 16px 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            transition: all 0.3s ease;
        }
        .course-card:active {
            transform: scale(0.98);
        }

        /* 状态区分 - 极简 */
        .status-urgent {
            border: 1px solid #fed7aa;
            box-shadow: 0 0 0 1px rgba(249, 115, 22, 0.08), 0 4px 12px rgba(249, 115, 22, 0.06);
        }
        .status-upcoming {
            border: 1px solid transparent;
        }
        .status-done {
            border: 1px solid #f3f4f6;
            opacity: 0.85;
        }
        .status-ended {
            border: 1px solid #f3f4f6;
            opacity: 0.75;
        }

        /* 左侧时间区状态色 */
        .time-urgent {
            background: linear-gradient(180deg, #fff7ed 0%, #fff 100%);
        }
        .time-ended {
            background: #fafafa;
        }
        .time-done {
            background: #fafafa;
        }

        /* 按钮 */
        .btn-urgent {
            background: linear-gradient(135deg, #ff7a45, #ff9966);
            box-shadow: 0 4px 12px rgba(255, 122, 69, 0.3);
            color: white;
        }
        .btn-normal {
            background: linear-gradient(135deg, #ff7a45, #ff9966);
            color: white;
        }
        /* 统一已下课和已完成的查看按钮 */
        .btn-view {
            background: #fff7ed;
            color: #ff7a45;
            border: 1px solid #fed7aa;
        }
        .btn-view:active {
            background: #ffedd5;
        }

        /* 标签 */
        .tag-booking {
            background: #fff7ed;
            color: #ff7a45;
            border: 1px solid #fed7aa;
        }
        .tag-booking-ended {
            background: #fff7ed;
            color: #ff7a45;
            border: 1px solid #fed7aa;
            opacity: 0.7;
        }
        .tag-done {
            background: #f0fdf4;
            color: #22c55e;
            border: 1px solid #bbf7d0;
        }
        .tag-ended {
            background: #f3f4f6;
            color: #9ca3af;
            border: 1px solid #e5e7eb;
        }

        /* 底部TabBar */
        .tabbar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: white;
            border-top: 1px solid #f0f0f0;
            padding-bottom: env(safe-area-inset-bottom, 0);
            z-index: 100;
        }

        .tabbar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 6px 0;
            color: #999;
            font-size: 11px;
        }
        .tabbar-item.active {
            color: #ff7a45;
        }

        /* 动画 */
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .anim-up {
            animation: slideInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(255, 122, 69, 0.35); }
            70% { box-shadow: 0 0 0 10px rgba(255, 122, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 122, 69, 0); }
        }
        .btn-pulse {
            animation: pulse-ring 2s infinite;
        }

        /* 点名弹窗 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: white;
            width: 100%;
            max-width: 430px;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-overlay.show .modal-content {
            transform: translateY(0);
        }

        /* 学员选择 */
        .student-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .student-item:last-child {
            border-bottom: none;
        }
        .check-circle {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .check-circle.checked {
            background: #ff7a45;
            border-color: #ff7a45;
        }

        /* 滚动容器 */
        .scroll-area {
            overflow-y: auto;
            padding-bottom: 100px;
        }
        .scroll-area::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div class="max-w-[430px] mx-auto bg-[#f5f5f5] min-h-screen relative">

        <!-- 顶部橙色区域 -->
        <div class="header-bg pb-4">
            <!-- 状态栏 -->
            <div class="status-bar">
                <span>12:18</span>
                <span class="text-sm font-medium">首页</span>
                <div class="capsule-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/></svg>
                    <div class="w-px h-4 bg-white/30"></div>
                    <div class="w-4 h-4 rounded-full border-2 border-white"></div>
                </div>
            </div>

            <!-- 问候语 -->
            <div class="px-4 pt-2 pb-4">
                <h1 class="text-2xl font-bold text-white">上午好！张老师</h1>
                <div class="flex items-center gap-1 mt-1 text-white/80 text-sm">
                    <span>金宇校区</span>
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                </div>
            </div>

            <!-- 统计卡片 -->
            <div class="stats-card">
                <!-- Tab -->
                <div class="flex gap-2 mb-4">
                    <span class="tab-active">今日</span>
                    <span class="tab-inactive">本周</span>
                    <span class="tab-inactive">上周</span>
                    <span class="tab-inactive">本月</span>
                </div>
                <!-- 数字 -->
                <div class="flex justify-around">
                    <div class="text-center">
                        <div class="text-2xl font-bold text-gray-800" id="stat-sign">0</div>
                        <div class="text-xs text-gray-400 mt-1">签到次数</div>
                    </div>
                    <div class="text-center">
                        <div class="text-2xl font-bold text-gray-800" id="stat-leave">0</div>
                        <div class="text-xs text-gray-400 mt-1">请假次数</div>
                    </div>
                    <div class="text-center">
                        <div class="text-2xl font-bold text-gray-800" id="stat-class">0</div>
                        <div class="text-xs text-gray-400 mt-1">点名课时</div>
                    </div>
                    <div class="text-center">
                        <div class="text-2xl font-bold text-gray-800" id="stat-amount">0.00</div>
                        <div class="text-xs text-gray-400 mt-1">课消金额</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 功能网格 -->
        <div class="feature-grid">
            <div class="grid grid-cols-4 gap-4">
                <div class="flex flex-col items-center" onclick="showToast('课时消课')">
                    <div class="feature-icon bg-green-50">✅</div>
                    <span class="text-xs text-gray-600">课时消课</span>
                </div>
                <div class="flex flex-col items-center" onclick="showToast('添加学生')">
                    <div class="feature-icon bg-orange-50">👤+</div>
                    <span class="text-xs text-gray-600">添加学生</span>
                </div>
                <div class="flex flex-col items-center" onclick="showToast('课时充值')">
                    <div class="feature-icon bg-red-50">💰</div>
                    <span class="text-xs text-gray-600">课时充值</span>
                </div>
                <div class="flex flex-col items-center" onclick="showToast('学员管理')">
                    <div class="feature-icon bg-blue-50">👥</div>
                    <span class="text-xs text-gray-600">学员管理</span>
                </div>
                <div class="flex flex-col items-center" onclick="showToast('班级管理')">
                    <div class="feature-icon bg-purple-50">🎓</div>
                    <span class="text-xs text-gray-600">班级管理</span>
                </div>
                <div class="flex flex-col items-center" onclick="showToast('课包管理')">
                    <div class="feature-icon bg-pink-50">📦</div>
                    <span class="text-xs text-gray-600">课包管理</span>
                </div>
                <div class="flex flex-col items-center" onclick="showToast('教师管理')">
                    <div class="feature-icon bg-indigo-50">👔</div>
                    <span class="text-xs text-gray-600">教师管理</span>
                </div>
                <div class="flex flex-col items-center" onclick="showToast('校区设置')">
                    <div class="feature-icon bg-cyan-50">📍</div>
                    <span class="text-xs text-gray-600">校区设置</span>
                </div>
            </div>
        </div>

        <!-- 今日课表 -->
        <div class="px-4 mt-4 mb-2">
            <h2 class="text-base font-bold text-gray-800">今日课表</h2>
        </div>

        <div id="course-container" class="scroll-area">
            <!-- JS 生成 -->
        </div>

        <!-- 底部TabBar -->
        <div class="tabbar">
            <div class="flex justify-around">
                <div class="tabbar-item active">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    <span>首页</span>
                </div>
                <div class="tabbar-item">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                    <span>统计</span>
                </div>
                <div class="tabbar-item">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    <span>我的</span>
                </div>
            </div>
        </div>

        <!-- 点名弹窗 -->
        <div class="modal-overlay" id="rollModal" onclick="closeModal(event)">
            <div class="modal-content" onclick="event.stopPropagation()">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold text-gray-800" id="modalTitle">点名</h3>
                    <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center text-gray-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
                <div class="text-sm text-gray-500 mb-4" id="modalInfo"></div>
                <div id="studentList"></div>
                <button onclick="confirmRoll()" class="w-full mt-4 py-3 rounded-xl text-white font-semibold btn-normal">
                    确认点名
                </button>
            </div>
        </div>

        <!-- Toast -->
        <div id="toast" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white px-4 py-2 rounded-lg text-sm opacity-0 pointer-events-none transition-opacity z-300"></div>
    </div>

    <script>
        // ===================== 课程数据 =====================
        let courses = [
            { id: 1, time: '07:30-09:00', name: '111', teacher: '老师老师', checked: 0, total: 2, room: 'A101', status: 'ended', students: ['小明', '小红'] },
            { id: 2, time: '09:30-10:30', name: '月月美术班', teacher: '月月老师', checked: 0, total: 2, room: 'B203', tag: '约', status: 'ended', students: ['张三', '李四'] },
            { id: 3, time: '14:00-15:30', name: '钢琴启蒙班', teacher: '李老师', checked: 3, total: 3, room: 'C305', status: 'done', students: ['王五', '赵六', '孙七'] },
            { id: 4, time: '16:00-17:30', name: '舞蹈基础', teacher: '王老师', checked: 2, total: 2, room: 'D102', status: 'done', students: ['周八', '吴九'] },
            { id: 5, time: '18:30-20:00', name: '编程思维', teacher: '张老师', checked: 0, total: 4, room: 'E501', status: 'upcoming', students: ['郑十', '钱十一', '孙十二', '李十三'] },
            { id: 6, time: '17:00-18:30', name: '英语口语', teacher: 'Smith老师', checked: 0, total: 2, room: 'A205', tag: '约', status: 'urgent', students: ['王小明', '赵小红'] },
        ];

        let currentRollId = null;
        let tempChecked = [];

        const typeConfig = {
            normal: { icon: '📚', bg: 'bg-orange-50', text: 'text-orange-500', border: 'border-orange-100' },
            art: { icon: '🎨', bg: 'bg-pink-50', text: 'text-pink-500', border: 'border-pink-100' },
            music: { icon: '🎹', bg: 'bg-purple-50', text: 'text-purple-500', border: 'border-purple-100' },
            dance: { icon: '💃', bg: 'bg-rose-50', text: 'text-rose-500', border: 'border-rose-100' },
            tech: { icon: '💻', bg: 'bg-blue-50', text: 'text-blue-500', border: 'border-blue-100' },
            english: { icon: '🔤', bg: 'bg-indigo-50', text: 'text-indigo-500', border: 'border-indigo-100' },
        };

        function getConfig(type) {
            return typeConfig[type] || typeConfig.normal;
        }

        function getStatusClass(status) {
            return { urgent: 'status-urgent', upcoming: 'status-upcoming', done: 'status-done', ended: 'status-ended', active: 'status-upcoming' }[status] || 'status-upcoming';
        }

        function getTimeClass(status) {
            return { urgent: 'time-urgent', upcoming: '', done: 'time-done', ended: 'time-ended', active: '' }[status] || '';
        }

        function getBtnClass(status) {
            // urgent/upcoming/active：橙色实心白字按钮
            // done/ended：统一用 btn-view（浅橙底+橙字）
            if (status === 'urgent') return 'btn-urgent btn-pulse';
            if (status === 'upcoming' || status === 'active') return 'btn-normal';
            return 'btn-view'; // done 和 ended 统一
        }

        function getTextClass(status) {
            return { urgent: '', upcoming: '', done: 'opacity-70', ended: 'opacity-55' }[status] || '';
        }

        function getNameClass(status) {
            return { urgent: '', upcoming: '', done: 'text-gray-600', ended: 'text-gray-400' }[status] || '';
        }

        function getProgressClass(status) {
            return { urgent: 'bg-orange-400', upcoming: 'bg-orange-400', done: 'bg-green-400', ended: 'bg-gray-200', active: 'bg-orange-400' }[status] || 'bg-orange-400';
        }

        function getBtnText(status) {
            if (status === 'ended' || status === 'done') return '查看';
            if (status === 'urgent') return '立即点名';
            if (status === 'active') return '继续点名';
            return '点名';
        }

        // 标签显示逻辑
        function getTagHTML(status, tag) {
            if (status === 'done') {
                return `<span class="px-1.5 py-0.5 tag-done text-[10px] font-medium rounded">已完成</span>`;
            }
            if (status === 'ended') {
                return `<span class="px-1.5 py-0.5 tag-ended text-[10px] font-medium rounded">已下课</span>`;
            }
            if (tag) {
                return `<span class="px-1.5 py-0.5 tag-booking text-[10px] font-medium rounded">${tag}</span>`;
            }
            return '';
        }

        // ===================== 渲染课程列表 =====================
        function renderCourses() {
            const container = document.getElementById('course-container');
            container.innerHTML = '';

            const statusOrder = { urgent: 0, active: 1, upcoming: 2, done: 3, ended: 4 };
            const sorted = [...courses].sort((a, b) => statusOrder[a.status] - statusOrder[b.status]);

            sorted.forEach((course, index) => {
                const config = getConfig(course.type || 'normal');
                const status = course.status;
                const sc = getStatusClass(status);
                const tc = getTimeClass(status);
                const bc = getBtnClass(status);
                const txt = getTextClass(status);
                const nc = getNameClass(status);
                const pc = getProgressClass(status);
                const isEnded = status === 'ended';
                const isDone = status === 'done';
                const isView = isEnded || isDone; // 查看状态
                const [start, end] = course.time.split('-');
                const delay = index * 0.05;

                container.innerHTML += `
                    <div class="course-card ${sc} anim-up" style="animation-delay: ${delay}s" data-id="${course.id}">
                        <div class="flex">
                            <div class="w-[76px] shrink-0 ${config.bg} ${tc} flex flex-col items-center justify-center py-3 border-r ${config.border}">
                                <span class="text-[12px] font-bold ${config.text}">${start}</span>
                                <div class="w-4 h-px bg-orange-200 my-0.5"></div>
                                <span class="text-[12px] font-bold ${config.text} opacity-60">${end}</span>
                            </div>
                            <div class="flex-1 px-3 py-3 flex items-center justify-between gap-2">
                                <div class="min-w-0">
                                    <div class="flex items-center gap-1.5 mb-1">
                                        <h3 class="text-[15px] font-bold text-gray-800 truncate ${nc}">${course.name}</h3>
                                        ${getTagHTML(status, course.tag)}
                                    </div>
                                    <div class="flex items-center gap-3 text-[11px] text-gray-400 ${txt}">
                                        <span class="flex items-center gap-0.5">
                                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                                            ${course.teacher}
                                        </span>
                                        <span class="flex items-center gap-0.5">
                                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                                            ${course.room}
                                        </span>
                                    </div>
                                    ${!isEnded ? `
                                    <div class="flex items-center gap-2 mt-2">
                                        <span class="text-[11px] text-gray-400 ${txt}">已点名 <span class="font-semibold ${isDone ? 'text-green-500' : 'text-orange-500'}">${course.checked}/${course.total}</span></span>
                                        <div class="w-12 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                                            <div class="h-full rounded-full ${pc}" style="width: ${(course.checked/course.total)*100}%"></div>
                                        </div>
                                    </div>
                                    ` : `
                                    <div class="flex items-center gap-2 mt-2">
                                        <span class="text-[11px] text-gray-300">已点名 <span class="font-semibold text-gray-300">${course.checked}/${course.total}</span></span>
                                        <div class="w-12 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                                            <div class="h-full rounded-full bg-gray-200" style="width: ${(course.checked/course.total)*100}%"></div>
                                        </div>
                                    </div>
                                    `}
                                </div>
                                <div class="shrink-0 flex flex-col items-end gap-1">
                                    ${status === 'urgent' ? '<span class="text-[10px] text-orange-500 font-medium">⏱ 还有3分钟</span>' : ''}
                                    <button onclick="handleBtnClick(${course.id})" class="px-4 py-1.5 rounded-full text-[12px] font-semibold shadow-sm active:scale-95 transition-all ${bc}">
                                        ${getBtnText(status)}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            updateStats();
        }

        // ===================== 更新统计数据 =====================
        function updateStats() {
            const done = courses.filter(c => c.status === 'done').length;
            const totalChecked = courses.reduce((sum, c) => sum + c.checked, 0);

            document.getElementById('stat-sign').textContent = totalChecked;
            document.getElementById('stat-class').textContent = done;
            document.getElementById('stat-amount').textContent = (done * 120).toFixed(2);
        }

        // ===================== 按钮点击处理 =====================
        function handleBtnClick(id) {
            const course = courses.find(c => c.id === id);
            if (!course) return;

            // 已结束和已完成都点击查看详情/记录
            if (course.status === 'ended' || course.status === 'done') {
                showToast('查看签到记录: ' + course.name + '（' + course.checked + '/' + course.total + '）');
                return;
            }

            // 打开点名弹窗
            openRollModal(course);
        }

        // ===================== 点名弹窗 =====================
        function openRollModal(course) {
            currentRollId = course.id;
            tempChecked = [];

            document.getElementById('modalTitle').textContent = course.name + ' - 点名';
            document.getElementById('modalInfo').textContent = `${course.time} · ${course.teacher} · ${course.room}`;

            const list = document.getElementById('studentList');
            list.innerHTML = '';

            course.students.forEach((name, i) => {
                const isChecked = i < course.checked;
                if (isChecked) tempChecked.push(i);

                list.innerHTML += `
                    <div class="student-item" onclick="toggleStudent(${i})">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-full bg-orange-100 flex items-center justify-center text-orange-500 text-sm font-bold">
                                ${name.charAt(0)}
                            </div>
                            <span class="text-sm text-gray-700">${name}</span>
                        </div>
                        <div class="check-circle ${isChecked ? 'checked' : ''}" id="check-${i}">
                            ${isChecked ? '<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>' : ''}
                        </div>
                    </div>
                `;
            });

            document.getElementById('rollModal').classList.add('show');
        }

        function toggleStudent(index) {
            const checkEl = document.getElementById('check-' + index);
            const idx = tempChecked.indexOf(index);

            if (idx > -1) {
                tempChecked.splice(idx, 1);
                checkEl.classList.remove('checked');
                checkEl.innerHTML = '';
            } else {
                tempChecked.push(index);
                checkEl.classList.add('checked');
                checkEl.innerHTML = '<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>';
            }
        }

        function confirmRoll() {
            const course = courses.find(c => c.id === currentRollId);
            if (course) {
                course.checked = tempChecked.length;
                if (course.checked >= course.total) {
                    course.status = 'done';
                } else if (course.checked > 0) {
                    course.status = 'active';
                } else {
                    course.status = course.status === 'urgent' ? 'urgent' : 'upcoming';
                }
                renderCourses();
                showToast('点名成功！已签到 ' + tempChecked.length + ' 人');
            }
            closeModal();
        }

        function closeModal(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('rollModal').classList.remove('show');
        }

        // ===================== Toast =====================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2000);
        }

        // ===================== 初始化 =====================
        renderCourses();
    </script>
</body>
</html>
