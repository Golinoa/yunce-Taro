<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>课表日历选中态方案预览（G 方案时期）</title>
<style>
  :root {
    --ink: #1f2329;
    --ink-soft: #6b7280;
    --line: #eceef1;
    --bg: #f5f6f8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 28px 16px 60px;
  }
  header.page-head {
    max-width: 1180px; margin: 0 auto 26px; text-align: center;
  }
  header.page-head h1 { font-size: 22px; font-weight: 800; letter-spacing: .5px; }
  header.page-head p { margin-top: 8px; color: var(--ink-soft); font-size: 13px; line-height: 1.7; }
  .wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; }

  /* ============ 方案区块 ============ */
  .scheme {
    background: #fff; border: 1px solid var(--line); border-radius: 18px;
    padding: 20px 22px 24px;
  }
  .scheme.g { border: 2px solid #3B6EF5; box-shadow: 0 6px 22px rgba(59,110,245,.14); }
  .scheme h2 { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
  .scheme .badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 8px;
    background: #3B6EF5; color: #fff; font-size: 14px; font-weight: 800;
  }
  .scheme .desc { color: var(--ink-soft); font-size: 12.5px; margin: 8px 0 16px; line-height: 1.7; }

  /* ============ 主题行（蓝 / 珊瑚 / 橙） ============ */
  .theme-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .theme {
    flex: 1 1 280px; min-width: 260px; border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden; background: #fafbfc;
  }
  .theme-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; color: #fff; font-weight: 700; font-size: 13px;
  }
  .theme-head .swatch { width: 14px; height: 14px; border-radius: 4px; background: rgba(255,255,255,.9); }

  /* ---- 分类 Tab 栏（班课/团课/私教/场地 + 筛选） ---- */
  .tabs {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; background: #fff;
  }
  .tab {
    height: 30px; padding: 0 14px; border-radius: 15px;
    display: inline-flex; align-items: center; font-size: 13px; font-weight: 600;
    border: 1px solid var(--line); color: var(--ink-soft); background: #fff;
    white-space: nowrap;
  }
  .tab.filter { margin-left: auto; padding: 0 12px; }
  .tab.filter svg { width: 14px; height: 14px; margin-right: 4px; }

  /* ---- 单行周历 ---- */
  .cal {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 6px; padding: 14px; background: #fff;
  }
  .cell {
    position: relative; aspect-ratio: 1 / 1; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: var(--ink);
    background: #f3f4f6;
  }
  .cell.weekend { color: #9aa0ac; }
  .cell.today { background: #e9eaf0; color: #6b7280; }
  .cell .dot {
    position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%);
    width: 5px; height: 5px; border-radius: 50%; background: #9aa0ac;
  }

  /* ==================================================== */
  /* ============ G · 实心圆 + 白色边框（已批准） ============ */
  .scheme-g .tab.active {
    background: hsl(var(--primary) / .10); color: hsl(var(--primary));
    border: 1px solid hsl(var(--primary) / .55);
  }
  .scheme-g .cell.selected {
    background: hsl(var(--primary)); color: #fff; font-weight: 800;
    border: 3px solid #fff;
    box-shadow: 0 2px 6px hsl(var(--primary) / .35), 0 0 0 1px hsl(var(--primary) / .25);
  }

  footer.note {
    max-width: 1180px; margin: 30px auto 0; color: var(--ink-soft);
    font-size: 13px; line-height: 1.8; text-align: center;
  }
  footer.note code {
    background: #eef0f3; padding: 2px 6px; border-radius: 5px; font-size: 12px;
  }
</style>
</head>
<body>
  <header class="page-head">
    <h1>课表日历选中态 · 配色方案预览</h1>
    <p>色值取自 <code>src/app.scss</code> 真实主题变量（蓝 / 珊瑚 / 橙）。本版本仅保留已批准的 <strong>G 方案</strong>：<strong>实心圆 + 白色边框 + 浅底描边 Tab</strong>，不含后续被驳回的日期区间效果。</p>
  </header>

  <div class="wrap" id="wrap"></div>

  <footer class="note">
    交互：告诉我「选 方案X + 主题名」或「方案X 但把白边再细一点 / 光晕再淡一点」即可，我直接落到 <code>src/app.scss</code> 的日历语义色变量里并重新编译验证。
  </footer>

<script>
  // 三套主题的真实 HSL 变量（与 src/app.scss 一致）
  const THEMES = [
    { key: "blue",   name: "蓝色（默认）", primary: "222 78% 60%",  accent: "258 80% 67%",  head: "#3B6EF5" },
    { key: "coral",  name: "珊瑚",         primary: "7 90% 70%",    accent: "174 55% 48%",  head: "#f97768" },
    { key: "orange", name: "橙色",         primary: "32 100% 58%",  accent: "188 95% 43%",  head: "#FF8A2A" },
  ];

  // 单行周历：一二三四五六日，14=今天，15=选中，16 有课（点）
  const DAYS = [
    { w: "一", d: 12, cls: "" },
    { w: "二", d: 13, cls: "" },
    { w: "三", d: 14, cls: "today" },
    { w: "四", d: 15, cls: "selected" },
    { w: "五", d: 16, cls: "dot" },
    { w: "六", d: 17, cls: "weekend" },
    { w: "日", d: 18, cls: "weekend" },
  ];

  const FILTER_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5h18l-7 8v5l-4 2v-7z"/></svg>';

  const SCHEMES = [
    { k: "g", label: "G", title: "实心圆 + 白色边框（已批准）", desc: "主题色实心圆 + 3px 白色边框，像从背景里「抠出来」；Tab 用浅底描边（1 week 风格）。" },
  ];

  function buildThemeBlock(theme, schemeKey) {
    const block = document.createElement("div");
    block.className = "theme";
    block.style.setProperty("--primary", theme.primary);
    block.style.setProperty("--accent", theme.accent);

    block.innerHTML = `
      <div class="theme-head" style="background:${theme.head}">
        <span class="swatch"></span>${theme.name}
      </div>
      <div class="tabs">
        <span class="tab active">班课</span>
        <span class="tab">团课</span>
        <span class="tab">私教</span>
        <span class="tab">场地</span>
        <span class="tab filter">${FILTER_SVG}筛选</span>
      </div>
      <div class="cal">
        ${DAYS.map(day => `
          <div class="cell ${day.cls}">${day.d}${day.cls === "dot" ? '<span class="dot"></span>' : ""}</div>
        `).join("")}
      </div>
    `;
    return block;
  }

  const wrap = document.getElementById("wrap");
  SCHEMES.forEach(s => {
    const section = document.createElement("section");
    section.className = `scheme scheme-${s.k}`;
    section.innerHTML = `
      <h2><span class="badge">${s.label}</span> ${s.title}</h2>
      <p class="desc">${s.desc}</p>
      <div class="theme-row"></div>
    `;
    const row = section.querySelector(".theme-row");
    THEMES.forEach(t => row.appendChild(buildThemeBlock(t, s.k)));
    wrap.appendChild(section);
  });
</script>
</body>
</html>
